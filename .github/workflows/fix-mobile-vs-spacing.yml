name: Fix mobile VS spacing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-vs-spacing.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch original CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/styles.css')
          s=p.read_text()
          old='.combat-stage{grid-template-columns:1fr 48px 1fr;min-height:340px;padding:10px 7px 116px}'
          new='.combat-stage{grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:4px;min-height:340px;padding:10px 7px 116px}.battle-center{position:relative;left:auto;top:auto;transform:none;align-self:start;margin-top:72px;width:100%;min-width:0}.battle-center img{width:min(64px,16vw)!important;max-width:64px!important}.fighter{min-width:0}.fighter-art{max-width:100%}'
          if s.count(old)!=1:
              raise SystemExit(f'expected one mobile combat-stage rule, found {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -Fq 'grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr)' src/styles.css
          grep -Fq '.battle-center{position:relative;left:auto;top:auto;transform:none;align-self:start;margin-top:72px' src/styles.css
          grep -Fq '.battle-center img{width:min(64px,16vw)!important;max-width:64px!important}' src/styles.css
          node --check src/game.js
          node --check src/pk.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git add src/styles.css
          git commit -m 'fix: keep VS in dedicated mobile center lane'
          git push
          git rm .github/workflows/fix-mobile-vs-spacing.yml
          git commit -m 'chore: remove completed mobile VS workflow'
          git push