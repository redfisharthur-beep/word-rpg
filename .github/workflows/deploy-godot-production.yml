name: Deploy Godot Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_GODOT to replace the production Web assets with the tested Godot Web build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-godot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/godot-migration' && inputs.confirm == 'DEPLOY_GODOT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Godot migration
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker tooling
        run: npm install --ignore-scripts

      - name: Sync shared game data
        run: npm run sync:data

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.0'
          use-dotnet: false
          include-templates: true

      - name: Import project and validate scripts
        run: godot --headless --path . --editor --quit

      - name: Run RPG parity tests
        run: godot --headless --path . --script res://godot/tests/rpg_parity_test.gd

      - name: Run native PK protocol tests
        run: timeout 20s godot --headless --path . res://godot/tests/pk_protocol_test.tscn

      - name: Export production Godot Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          PCK_BYTES=$(stat -c%s build/web/index.pck)
          PCK_LIMIT=$((70 * 1024 * 1024))
          echo "PCK bytes: $PCK_BYTES / limit: $PCK_LIMIT"
          test "$PCK_BYTES" -le "$PCK_LIMIT"
          du -h build/web/*

      - name: Smoke test main scene
        run: godot --headless --path . --quit-after 3

      - name: Smoke test native PK scene
        run: godot --headless --path . res://godot/scenes/pk.tscn --quit-after 3

      - name: Preserve exact production artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-rpg-godot-production-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Verify Cloudflare credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy Godot Web to production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.godot.jsonc
