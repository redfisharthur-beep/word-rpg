          p=Path('src/pk.js'); s=p.read_text()
          old="if(qIndex>=3){const elapsed=Math.min(30000,Math.max(1,Math.round(performance.now()-started)-1800));if(round<=2)used.push(...selected);send({type:'ready',selected:round<=2?selected:[],correct,elapsedMs:elapsed});status='wait';render();return}"
          new="if(qIndex>=5){const elapsed=Math.min(50000,Math.max(1,Math.round(performance.now()-started)-4500));if(round<=2)used.push(...selected);send({type:'ready',selected:round<=2?selected:[],correct,elapsedMs:elapsed});status='wait';render();return}"
          if s.count(old)!=1: raise SystemExit('PK answer completion mismatch')
          p.write_text(s.replace(old,new,1))

          # ---------- Worker daily identity reservation ----------
          p=Path('worker/index.js'); s=p.read_text()
          s=s.replace('const WORD_COUNT=800;','const WORD_COUNT=1200;',1)
          s=re.sub(r"const qset=\(used=\[\]\)=>\{.*?\};\n",'',s,count=1)
          helper="""const dailyDate=()=>new Date(Date.now()+8*60*60*1000).toISOString().slice(0,10);
async function questionIdentityKeys(request,env){const keys=[],session=await readSession(request,env);if(session?.sub)keys.push(`line:${session.sub}`);const ip=(request.headers.get('CF-Connecting-IP')||(request.headers.get('X-Forwarded-For')||'').split(',')[0]||'').trim();if(ip)keys.push(`ip:${await sha256Base64Url(ip)}`);if(!keys.length)keys.push(`ip:${await sha256Base64Url('unknown')}`);return [...new Set(keys)];}
const questionStub=(env,key)=>env.USER_STORE.get(env.USER_STORE.idFromName(`questions:${key}`));
async function usedQuestions(env,key,date){const res=await questionStub(env,key).fetch(`https://user/questions?date=${encodeURIComponent(date)}`);if(!res.ok)return [];const data=await res.json();return Array.isArray(data.used)?data.used:[];}
async function markQuestions(env,key,date,indices){return questionStub(env,key).fetch('https://user/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,indices})});}
async function reserveDailyQuestions(env,keys,count){const date=dailyDate(),unique=[...new Set(keys)],need=clamp(Math.round(Number(count)||1),1,20);for(let attempt=0;attempt<8;attempt++){const blocked=new Set();for(const key of unique)for(const i of await usedQuestions(env,key,date))blocked.add(i);const available=[];for(let i=0;i<WORD_COUNT;i++)if(!blocked.has(i))available.push(i);if(available.length<need)throw new Error('今日題庫已完成');for(let i=available.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]]}const chosen=available.slice(0,need);let conflict=false;for(const key of unique){const res=await markQuestions(env,key,date,chosen);if(res.status===409){conflict=true;break}if(!res.ok)throw new Error('題庫紀錄失敗')}if(!conflict)return chosen}throw new Error('題庫忙碌，請再試一次');}
async function questionsApi(request,env){if(request.method!=='GET')return json({error:'Method not allowed'},405);const count=clamp(Math.round(Number(new URL(request.url).searchParams.get('count'))||10),1,20),keys=await questionIdentityKeys(request,env);try{return json({date:dailyDate(),indices:await reserveDailyQuestions(env,keys,count),count})}catch(err){return json({error:err?.message||'今日題庫已完成'},429)}}
"""
          marker='function callbackUrl(url,env)'
          if s.count(marker)!=1: raise SystemExit('worker helper insertion marker mismatch')
          s=s.replace(marker,helper+marker,1)
          s=s.replace("if(url.pathname==='/api/progress')return progressApi(request,env);","if(url.pathname==='/api/progress')return progressApi(request,env);if(url.pathname==='/api/questions')return questionsApi(request,env);",1)

          user_class="""export class UserStore extends DurableObject{
  constructor(ctx,env){super(ctx,env);this.ctx=ctx;this.env=env}
  async fetch(request){const url=new URL(request.url);if(url.pathname==='/questions'){const date=url.searchParams.get('date')||'';let record=await this.ctx.storage.get('dailyQuestions')||{date:'',used:[]};if(request.method==='GET'){if(record.date!==date)return json({date,used:[]});return json({date,used:Array.isArray(record.used)?record.used:[]})}if(request.method==='POST'){let body;try{body=await request.json()}catch{return json({error:'Invalid JSON'},400)}const day=String(body.date||''),indices=[...new Set((Array.isArray(body.indices)?body.indices:[]).map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<WORD_COUNT))];if(!day||!indices.length)return json({error:'Invalid questions'},400);if(record.date!==day)record={date:day,used:[]};const used=new Set(Array.isArray(record.used)?record.used:[]);if(indices.some(i=>used.has(i)))return json({error:'Question conflict'},409);for(const i of indices)used.add(i);record={date:day,used:[...used]};await this.ctx.storage.put('dailyQuestions',record);return json(record)}return json({error:'Method not allowed'},405)}if(request.method==='GET'){const progress=await this.ctx.storage.get('progress')||progressDefaults();return json(cleanProgress(progress))}if(request.method==='POST'){let body;try{body=await request.json()}catch{return json({error:'Invalid JSON'},400)}const progress=cleanProgress(body);await this.ctx.storage.put('progress',progress);return json(progress)}return json({error:'Method not allowed'},405)}
}
"""
          s,n=re.subn(r"export class UserStore extends DurableObject\{.*?\n\}\n\nexport class Matchmaker",user_class+'\nexport class Matchmaker',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('UserStore replacement mismatch')

          old="async fetch(request){if(request.headers.get('Upgrade')!=='websocket')return new Response('WebSocket required',{status:426});const pair=new WebSocketPair(),client=pair[0],server=pair[1];this.ctx.acceptWebSocket(server);server.serializeAttachment({id:crypto.randomUUID(),state:'new',profile:null,opponentId:null,matchId:null,fighter:null,hand:null,used:[],round:1,ready:null,questionUsed:[]});server.send(JSON.stringify({type:'connected'}));return new Response(null,{status:101,webSocket:client})}"
          new="async fetch(request){if(request.headers.get('Upgrade')!=='websocket')return new Response('WebSocket required',{status:426});const questionKeys=await questionIdentityKeys(request,this.env),pair=new WebSocketPair(),client=pair[0],server=pair[1];this.ctx.acceptWebSocket(server);server.serializeAttachment({id:crypto.randomUUID(),state:'new',profile:null,opponentId:null,matchId:null,fighter:null,hand:null,used:[],round:1,ready:null,questionKeys,questionBatch:[]});server.send(JSON.stringify({type:'connected'}));return new Response(null,{status:101,webSocket:client})}"
          if s.count(old)!=1: raise SystemExit('Matchmaker fetch mismatch')
          s=s.replace(old,new,1)
          old="webSocketMessage(ws,message){let data;try{data=JSON.parse(typeof message==='string'?message:new TextDecoder().decode(message))}catch{return}if(data.type==='join')this.join(ws,data.profile||{});if(data.type==='ready')this.ready(ws,data)}"
          new="async webSocketMessage(ws,message){let data;try{data=JSON.parse(typeof message==='string'?message:new TextDecoder().decode(message))}catch{return}if(data.type==='join')await this.join(ws,data.profile||{});if(data.type==='ready')this.ready(ws,data)}"
          if s.count(old)!=1: raise SystemExit('webSocketMessage mismatch')
          s=s.replace(old,new,1)

          join="""  async join(ws,p){let att=ws.deserializeAttachment()||{};const profile=this.profile(p),stats=progressionStats(profile.role,profile.pet,profile.level,profile.rpg).total;att={...att,state:'waiting',profile,fighter:makeFighter({...stats,role:profile.role,pet:profile.pet,rpg:profile.rpg}),hand:dealHand(9,profile.role,profile.level),used:[],round:1,ready:null,questionBatch:[]};ws.serializeAttachment(att);const other=this.ctx.getWebSockets().find(x=>x!==ws&&x.deserializeAttachment()?.state==='waiting');if(!other){this.send(ws,{type:'queued'});return}let oa=other.deserializeAttachment(),batch;try{batch=await reserveDailyQuestions(this.env,[...(att.questionKeys||[]),...(oa.questionKeys||[])],10)}catch(err){att.state='finished';oa.state='finished';ws.serializeAttachment(att);other.serializeAttachment(oa);this.send(ws,{type:'error',message:err?.message||'今日題庫已完成'});this.send(other,{type:'error',message:err?.message||'今日題庫已完成'});return}const matchId=crypto.randomUUID(),questions=batch.slice(0,5);att={...att,state:'matched',opponentId:oa.id,matchId,questionBatch:[...batch]};oa={...oa,state:'matched',opponentId:att.id,matchId,questionBatch:[...batch]};ws.serializeAttachment(att);other.serializeAttachment(oa);this.send(ws,{type:'matched',self:this.view(att),opponent:this.view(oa),hand:att.hand,questions});this.send(other,{type:'matched',self:this.view(oa),opponent:this.view(att),hand:oa.hand,questions})}
  cleanReady"""
          s,n=re.subn(r"  join\(ws,p\)\{.*?\n  cleanReady",join,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('join replacement mismatch')
          s=s.replace("const correct=clamp(Math.round(Number(data.correct)||0),0,3),elapsedMs=clamp(Math.round(Number(data.elapsedMs)||30000),200,30000)","const correct=clamp(Math.round(Number(data.correct)||0),0,5),elapsedMs=clamp(Math.round(Number(data.elapsedMs)||50000),200,50000)",1)
          old="const nextQuestions=!finished&&round<2?qset(a.questionUsed||[]):null;if(nextQuestions){a.questionUsed=[...(a.questionUsed||[]),...nextQuestions];b.questionUsed=[...(b.questionUsed||[]),...nextQuestions]}"
          new="const nextQuestions=!finished&&round<2?(a.questionBatch||[]).slice(5,10):null;"
          if s.count(old)!=1: raise SystemExit('next PK question batch mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)

          # ---------- permanent word-bank test ----------
          Path('tests/words.mjs').write_text("""import assert from 'node:assert/strict';\nimport {WORDS,makeQuestion} from '../src/words.js';\nimport {accuracyMultiplier} from '../src/cards.js';\nassert.equal(WORDS.length,1200);\nassert.equal(new Set(WORDS.map(x=>String(x.word).toLowerCase())).size,1200);\nfor(const i of [0,399,799,1199]){const q=makeQuestion(i);assert.ok(q.word&&q.answer&&Array.isArray(q.options)&&q.options.length>=2)}\nassert.equal(accuracyMultiplier(0),0);assert.ok(accuracyMultiplier(1)<accuracyMultiplier(2));assert.ok(accuracyMultiplier(2)<accuracyMultiplier(3));assert.ok(accuracyMultiplier(3)<accuracyMultiplier(4));assert.ok(accuracyMultiplier(4)<accuracyMultiplier(5));assert.equal(accuracyMultiplier(5),1.5);\nconsole.log('Words and 5-question scoring OK');\n""")
          p=Path('package.json'); pkg=json.loads(p.read_text());pkg['scripts']['test']='node tests/rpg-systems.mjs && node tests/words.mjs';p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js tests/*.mjs; do node --check "$f"; done
          npm test
          node -e "import('./src/words.js').then(m=>{if(m.WORDS.length!==1200)process.exit(1);console.log('WORD_COUNT',m.WORDS.length)})"
          grep -Fq 'const WORD_COUNT=1200;' worker/index.js
          grep -Fq "url.pathname==='/api/questions'" worker/index.js
          grep -Fq 'reserveDailyQuestions(this.env' worker/index.js
          grep -Fq 'run.qIndex>=5' src/game.js
          grep -Fq 'qIndex>=5' src/pk.js
          grep -Fq 'run.stats.total+=5' src/game.js
          grep -Fq 'dailyQuestionIndices' src/game.js
          grep -Fq 'questionBatch' worker/index.js
      - name: Commit source
        shell: bash
        run: |
          git config user.name "openai-workflow"
          git config user.email "actions@users.noreply.github.com"
          git add src/words.js src/cards.js src/game.js src/pk.js worker/index.js tests/words.mjs package.json
          git diff --cached --quiet && exit 1
