          old="export function accuracyMultiplier(correct,actor=null){if(correct===3)return 1.5;if(correct===2)return 1.15;if(correct===1){const fx=actor?.pet==='owl'?petSkillEffects(actor.pet,actor.rpg||{}):null;return .65+(fx?.oneAccuracy||0)}return 0;}"
          new="export function accuracyMultiplier(correct,actor=null){const n=Math.max(0,Math.min(5,Math.round(Number(correct)||0)));if(n===5)return 1.5;if(n===4)return 1.32;if(n===3)return 1.15;if(n===2)return .9;if(n===1){const fx=actor?.pet==='owl'?petSkillEffects(actor.pet,actor.rpg||{}):null;return .65+(fx?.oneAccuracy||0)}return 0;}"
          if s.count(old)!=1: raise SystemExit('accuracyMultiplier target mismatch')
          p.write_text(s.replace(old,new,1))

          # ---------- PvE / tower: 10 reserved daily questions ----------
          p=Path('src/game.js'); s=p.read_text()
          s=s.replace("import {WORDS,makeQuestion,wordDeck} from './words.js';","import {makeQuestion} from './words.js';",1)
          old="function q(){if(!run.wordDeck?.length)run.wordDeck=wordDeck();return makeQuestion(run.wordDeck.pop())}\nfunction questions(){return [q(),q(),q()]}"
          new="async function fetchDailyQuestionBatch(count=10){const r=await fetch(`/api/questions?count=${count}`,{credentials:'same-origin',cache:'no-store'}),data=await r.json().catch(()=>({}));if(!r.ok||!Array.isArray(data.indices)||data.indices.length!==count)throw new Error(data.error||'題庫讀取失敗');return data.indices}\nfunction roundQuestions(){const start=(run.round-1)*5,indices=(run.dailyQuestionIndices||[]).slice(start,start+5);if(indices.length!==5)throw new Error('每日題目不足');return indices.map(makeQuestion)}"
          if s.count(old)!=1: raise SystemExit('local question helpers mismatch')
          s=s.replace(old,new,1)
          s=s.replace("wrongAnswers:[],wordDeck:wordDeck(),stageRewarded:false","wrongAnswers:[],dailyQuestionIndices:[],loadingQuestions:false,stageRewarded:false",1)
          s=s.replace("run.wrongAnswers=[];run.stageRewarded=false","run.wrongAnswers=[];run.dailyQuestionIndices=[];run.loadingQuestions=false;run.stageRewarded=false",1)
          s=s.replace("if(screen!=='cards'||run.round>3)return","if(screen!=='cards'||run.round>2)return",1)
          old="function confirmCards(auto=false){if(run.selected.length!==3){if(!auto)return;autoFillSelection()}if(run.selected.length!==3)return;clearTimeout(selectTimeout);clearInterval(selectTicker);run.selectDeadline=0;run.enemySelected=aiPickIndices();startQuiz()}"
          new="async function confirmCards(auto=false){if(run.loadingQuestions)return;if(run.selected.length!==3){if(!auto)return;autoFillSelection()}if(run.selected.length!==3)return;clearTimeout(selectTimeout);clearInterval(selectTicker);run.selectDeadline=0;if(run.round===1&&(run.dailyQuestionIndices||[]).length!==10){run.loadingQuestions=true;try{run.dailyQuestionIndices=await fetchDailyQuestionBatch(10)}catch(err){run.loadingQuestions=false;alert(err?.message||'今日題庫讀取失敗');render();return}run.loadingQuestions=false}run.enemySelected=aiPickIndices();startQuiz()}"
          if s.count(old)!=1: raise SystemExit('confirmCards mismatch')
          s=s.replace(old,new,1)
          old="function startQuiz(){answerFeedback=null;run.correct=0;run.qIndex=0;run.qs=questions();run.quizStarted=performance.now();screen='quiz';render();startQuestionTimer()}"
          new="function startQuiz(){answerFeedback=null;run.correct=0;run.qIndex=0;run.qs=roundQuestions();run.quizStarted=performance.now();screen='quiz';render();startQuestionTimer()}"
          if s.count(old)!=1: raise SystemExit('startQuiz mismatch')
          s=s.replace(old,new,1)
          old="if(run.qIndex>=3){const elapsed=Math.min(30000,Math.max(1,Math.round(performance.now()-run.quizStarted)-1800));resolveRound(elapsed);return}"
          new="if(run.qIndex>=5){const elapsed=Math.min(50000,Math.max(1,Math.round(performance.now()-run.quizStarted)-4500));resolveRound(elapsed);return}"
          if s.count(old)!=1: raise SystemExit('solo answer completion mismatch')
