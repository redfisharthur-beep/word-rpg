name: Expand to 1200 daily-bound questions
on:
  push:
    paths:
      - '.github/workflows/daily-1200-questions.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover and run upgrade script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old=subprocess.check_output(['git','show','HEAD^:.github/workflows/daily-1200-questions.yml'],text=True)
          marker="          python3 - <<'PY'\n"
          start=old.index(marker)+len(marker)
          end=old.index("\n          PY\n      - name: Verify",start)
          block=old[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/daily_upgrade.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/daily_upgrade.py
      - name: Verify
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js tests/*.mjs; do node --check "$f"; done
          npm test
          node -e "import('./src/words.js').then(m=>{if(m.WORDS.length!==1200)process.exit(1);if(new Set(m.WORDS.map(x=>String(x.word).toLowerCase())).size!==1200)process.exit(1);console.log('WORD_COUNT',m.WORDS.length)})"
          grep -Fq 'const WORD_COUNT=1200;' worker/index.js
          grep -Fq "url.pathname==='/api/questions'" worker/index.js
          grep -Fq 'reserveDailyQuestions(this.env' worker/index.js
          grep -Fq 'run.qIndex>=5' src/game.js
          grep -Fq 'qIndex>=5' src/pk.js
          grep -Fq 'run.stats.total+=5' src/game.js
          grep -Fq 'dailyQuestionIndices' src/game.js
          grep -Fq 'questionBatch' worker/index.js
      - name: Commit source
        shell: bash
        run: |
          git config user.name "openai-workflow"
          git config user.email "actions@users.noreply.github.com"
          git add src/words.js src/cards.js src/game.js src/pk.js worker/index.js tests/words.mjs package.json
          git diff --cached --quiet && exit 1
          git commit -m "feat: 1200-word daily nonrepeating five-question rounds"
          git push origin HEAD:main
