name: Patch LV50 PK and setup UI

on:
  push:
    paths:
      - '.github/workflows/patch-lv50-pk-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: python .github/scripts/patch-lv50-pk-ui.py

      - name: Syntax check
        run: |
          node --check src/game.js
          node --check src/pk.js
          node --check worker/index.js
          node --check src/cards.js

      - name: Commit source update and remove temporary files
        run: |
          rm .github/workflows/patch-lv50-pk-ui.yml
          rm .github/scripts/patch-lv50-pk-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js src/pk.js src/styles.css worker/index.js .github/workflows/patch-lv50-pk-ui.yml .github/scripts/patch-lv50-pk-ui.py
          git commit -m "feat: cap level 50 and normalize PK progression"
          git push
