name: Add mythic equipment system
on:
  push:
    paths:
      - '.github/workflows/add-mythic-equipment.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mythic equipment system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old,new,1)

          # rpg.js
          p=Path('src/rpg.js'); s=p.read_text()
          s=rep(s,
          "  legendary:{name:'傳說',rank:3}\n};",
          "  legendary:{name:'傳說',rank:3},\n  mythic:{name:'神話',rank:4}\n};",
          'quality mythic')
          s=rep(s,
          "export const CRYSTAL_VALUE={common:1,rare:3,epic:8,legendary:20};",
          "export const CRYSTAL_VALUE={common:1,rare:3,epic:8,legendary:20,mythic:60};",
          'crystal mythic')
          s=rep(s,
          "  legendary:{ruby:{atk:.09,def:.09},thunder:{hp:.13,crit:.05},guardian:{def:.26},bloodspirit:{hp:.26},warbreaker:{atk:.13,hp:.13},battlesoul:{def:.13,crit:.05}}\n};",
          "  legendary:{ruby:{atk:.09,def:.09},thunder:{hp:.13,crit:.05},guardian:{def:.26},bloodspirit:{hp:.26},warbreaker:{atk:.13,hp:.13},battlesoul:{def:.13,crit:.05}},\n  mythic:{ruby:{atk:.14,def:.14},thunder:{hp:.20,crit:.08},guardian:{def:.40},bloodspirit:{hp:.40},warbreaker:{atk:.20,hp:.20},battlesoul:{def:.20,crit:.08}}\n};",
          'mythic stats')
          s=rep(s,
          "const ITEM_NAME={ruby:'紅曜石',thunder:'雷光石',guardian:'守護甲',bloodspirit:'血靈甲',warbreaker:'破軍戒',battlesoul:'戰魂戒'};",
          "const ITEM_NAME={ruby:'紅曜石',thunder:'雷光石',guardian:'守護甲',bloodspirit:'血靈甲',warbreaker:'破軍戒',battlesoul:'戰魂戒'};\nexport const MYTHIC_ABILITIES={\n  ruby:{name:'神火共振',desc:'紅牌效果 +15%'},\n  thunder:{name:'天雷裁決',desc:'黃牌效果 +15%'},\n  guardian:{name:'不滅聖盾',desc:'每場戰鬥開始獲得最大生命 18% 護盾'},\n  bloodspirit:{name:'血魂回生',desc:'綠牌效果 +20%'},\n  warbreaker:{name:'破軍神威',desc:'每回合第一張攻擊牌效果 +25%'},\n  battlesoul:{name:'戰魂不滅',desc:'受到的傷害降低 12%'}\n};",
          'mythic abilities')
          s=rep(s,
          "export function collectionEntries(){const defs={gem:['ruby','thunder'],armor:['guardian','bloodspirit'],ring:['warbreaker','battlesoul']},out=[];for(const [type,subs] of Object.entries(defs))for(const subtype of subs)for(const quality of QUALITY_ORDER){const item={type,subtype,quality,name:`${QUALITY[quality].name}${ITEM_NAME[subtype]}`,bonuses:bonusesFor(type,subtype,quality)};out.push({...item,key:collectionKey(item),art:lootImage(item)})}return out;}",
          "export function collectionEntries(){const defs={gem:['ruby','thunder'],armor:['guardian','bloodspirit'],ring:['warbreaker','battlesoul']},qualities=[...QUALITY_ORDER,'mythic'],out=[];for(const [type,subs] of Object.entries(defs))for(const subtype of subs)for(const quality of qualities){const item={type,subtype,quality,name:`${QUALITY[quality].name}${ITEM_NAME[subtype]}`,bonuses:bonusesFor(type,subtype,quality)};out.push({...item,key:collectionKey(item),art:lootImage(item)})}return out;}",
          'collection mythic')
          anchor="export function equipmentResonance(rpg){"
          mythic="""export function mythicAbilityText(item){const a=item?.quality==='mythic'?MYTHIC_ABILITIES[item?.subtype]:null;return a?`${a.name}｜${a.desc}`:'';}\nexport function mythicEquipmentEffects(rpg){\n  const clean=cleanRpg(rpg),byId=new Map(clean.inventory.map(x=>[x.id,x])),ids=[...clean.equipped.gems,clean.equipped.armor,...clean.equipped.rings].filter(Boolean),items=ids.map(id=>byId.get(id)).filter(x=>x?.quality==='mythic'),out={redAmp:0,yellowAmp:0,greenAmp:0,blueAmp:0,firstOffensiveAmp:0,startShieldPct:0,damageReduction:0,active:[]};\n  for(const item of items){const a=MYTHIC_ABILITIES[item.subtype];if(a)out.active.push({subtype:item.subtype,name:a.name,desc:a.desc});if(item.subtype==='ruby')out.redAmp=Math.max(out.redAmp,.15);if(item.subtype==='thunder')out.yellowAmp=Math.max(out.yellowAmp,.15);if(item.subtype==='guardian')out.startShieldPct=Math.max(out.startShieldPct,.18);if(item.subtype==='bloodspirit')out.greenAmp=Math.max(out.greenAmp,.20);if(item.subtype==='warbreaker')out.firstOffensiveAmp=Math.max(out.firstOffensiveAmp,.25);if(item.subtype==='battlesoul')out.damageReduction=Math.max(out.damageReduction,.12);}\n  return out;\n}\n\nexport function equipmentResonance(rpg){"""
          s=rep(s,anchor,mythic,'mythic effect helper')
          roll_anchor="export function rollLoot(stageIndex=0,level=1,r=Math.random){\n  const chances=[.45,.55,.68,1],idx=clamp(Math.round(stageIndex)||0,0,3);if(r()>chances[idx])return null;const quality=weightedQuality(idx,r),typeRoll=r();let item=typeRoll<.55?makeGem(quality,r):typeRoll<.80?makeArmor(quality,r):makeRing(quality,r);return {...item,stage:idx+1,level:clamp(Math.round(Number(level)||1),1,50),foundAt:Date.now()};\n}"
          roll_new=roll_anchor+"""\n\nexport function rollMythicLoot({boss=false,towerFloor=0,level=1}={},r=Math.random){\n  const floor=clamp(Math.round(Number(towerFloor)||0),0,10),chance=boss?.03:floor>=10?.12:floor>=8?.04:0;if(chance<=0||r()>=chance)return null;\n  const pool=[['gem','ruby'],['gem','thunder'],['armor','guardian'],['armor','bloodspirit'],['ring','warbreaker'],['ring','battlesoul']],pair=pick(pool,r),item=makeItem(pair[0],pair[1],'mythic');\n  return {...item,source:boss?'boss':'tower',towerFloor:floor,level:clamp(Math.round(Number(level)||1),1,50),foundAt:Date.now()};\n}"""
          s=rep(s,roll_anchor,roll_new,'mythic drops')
          s=rep(s,
          "export function itemBonusText(item){const b=item?.bonuses||{},parts=[];if(b.hpPct)parts.push(`生命 +${Math.round(b.hpPct*100)}%`);if(b.atkPct)parts.push(`攻擊 +${Math.round(b.atkPct*100)}%`);if(b.defPct)parts.push(`防禦 +${Math.round(b.defPct*100)}%`);if(b.crit)parts.push(`爆擊 +${Math.round(b.crit*100)}%`);return parts.join(' · ');}",
          "export function itemBonusText(item){const b=item?.bonuses||{},parts=[];if(b.hpPct)parts.push(`生命 +${Math.round(b.hpPct*100)}%`);if(b.atkPct)parts.push(`攻擊 +${Math.round(b.atkPct*100)}%`);if(b.defPct)parts.push(`防禦 +${Math.round(b.defPct*100)}%`);if(b.crit)parts.push(`爆擊 +${Math.round(b.crit*100)}%`);const mythic=mythicAbilityText(item);if(mythic)parts.push(`✦ ${mythic}`);return parts.join(' · ');}",
          'mythic bonus text')
          p.write_text(s)

          # cards.js
          p=Path('src/cards.js'); s=p.read_text()
          s=rep(s,
          "import {equipmentBonuses,petSkillEffects,petEnhanceLevel,equipmentResonance} from './rpg.js';",
          "import {equipmentBonuses,petSkillEffects,petEnhanceLevel,equipmentResonance,mythicEquipmentEffects} from './rpg.js';",
          'cards mythic import')
          s=rep(s,
          "  let dmg=Math.max(1,Math.round(raw*100/(100+effectiveDef(defender))));\n  if(defender.shield>0)",
          "  let dmg=Math.max(1,Math.round(raw*100/(100+effectiveDef(defender))));\n  const mythicGuard=mythicEquipmentEffects(defender?.rpg||{}).damageReduction;if(mythicGuard>0)dmg=Math.max(1,Math.round(dmg*(1-mythicGuard)));\n  if(defender.shield>0)",
          'mythic damage reduction')
          s=rep(s,
          "  const logs=[],acc=accuracyMultiplier(correct,actor),petFx=petSkillEffects(actor?.pet,actor?.rpg||{}),resonance=equipmentResonance(actor?.rpg||{});",
          "  const logs=[],acc=accuracyMultiplier(correct,actor),petFx=petSkillEffects(actor?.pet,actor?.rpg||{}),resonance=equipmentResonance(actor?.rpg||{}),mythic=mythicEquipmentEffects(actor?.rpg||{});",
          'mythic card context')
          s=rep(s,
          "  let roleAmp=1,petAmp=1,resAmp=1;",
          "  let roleAmp=1,petAmp=1,resAmp=1,mythicAmp=1;",
          'mythic amp init')
          s=rep(s,
          "  if(card.color==='blue'&&resonance.blueAmp>0){resAmp*=1+resonance.blueAmp;logs.push(`鐵壁共鳴 +${Math.round(resonance.blueAmp*100)}%`);}\n  applyCard(card,actor,target,acc*bond*boost*roleAmp*petAmp*resAmp,logs);",
          "  if(card.color==='blue'&&resonance.blueAmp>0){resAmp*=1+resonance.blueAmp;logs.push(`鐵壁共鳴 +${Math.round(resonance.blueAmp*100)}%`);}\n  if(card.color==='red'&&mythic.redAmp>0){mythicAmp*=1+mythic.redAmp;logs.push(`神火共振 +${Math.round(mythic.redAmp*100)}%`);}\n  if(card.color==='yellow'&&mythic.yellowAmp>0){mythicAmp*=1+mythic.yellowAmp;logs.push(`天雷裁決 +${Math.round(mythic.yellowAmp*100)}%`);}\n  if(card.color==='green'&&mythic.greenAmp>0){mythicAmp*=1+mythic.greenAmp;logs.push(`血魂回生 +${Math.round(mythic.greenAmp*100)}%`);}\n  if(isOffensive(card)&&offensiveIndex===0&&mythic.firstOffensiveAmp>0){mythicAmp*=1+mythic.firstOffensiveAmp;logs.push(`破軍神威 +${Math.round(mythic.firstOffensiveAmp*100)}%`);}\n  applyCard(card,actor,target,acc*bond*boost*roleAmp*petAmp*resAmp*mythicAmp,logs);",
          'apply mythic card powers')
          p.write_text(s)

          # game.js
          p=Path('src/game.js'); s=p.read_text()
          s=rep(s,
          "import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,itemBonusText,lootImage,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills,crystalValue,crystallizeItem,petEnhanceLevel,petEnhanceCost,enhancePet,synthesisInfo,synthesizeItem,equipmentResonance,collectionEntries,collectionProgress,PET_AWAKENING,recordTowerFloor} from './rpg.js';",
          "import {emptyRpg,cleanRpg,rollLoot,rollMythicLoot,addLoot,equipItem,unequipItem,itemBonusText,lootImage,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills,crystalValue,crystallizeItem,petEnhanceLevel,petEnhanceCost,enhancePet,synthesisInfo,synthesizeItem,equipmentResonance,collectionEntries,collectionProgress,PET_AWAKENING,recordTowerFloor,mythicEquipmentEffects} from './rpg.js';",
          'game mythic import')
          s=rep(s,
          "function lootArt(item,className='loot-art'){const src=item?.art||lootImage(item);return src?`<img class=\"${esc(className)}\" src=\"${esc(src)}\" alt=\"${esc(item?.name||'裝備')}\" decoding=\"async\">`:''}",
          "function lootArt(item,className='loot-art'){const src=item?.art||lootImage(item),fallback=item?.quality==='mythic'?lootImage({...item,quality:'legendary'}):'',onerror=fallback?` onerror=\"this.onerror=null;this.src='${esc(fallback)}'\"`:'';return src?`<img class=\"${esc(className)}\" src=\"${esc(src)}\" alt=\"${esc(item?.name||'裝備')}\" decoding=\"async\"${onerror}>`:''}",
          'mythic image fallback')
          s=rep(s,
          "run.lastReward=null;run.lastLoot=null;run.lastCrystals=0;screen='cards';render()",
          "run.lastReward=null;run.lastLoot=null;run.lastCrystals=0;const mythic=mythicEquipmentEffects(meta.rpg);if(mythic.startShieldPct>0)run.player.shield=Math.max(run.player.shield||0,Math.round(run.player.maxHp*mythic.startShieldPct));screen='cards';render()",
          'guardian start shield')
          s=rep(s,
          "${item.quality!=='legendary'?`<button class=\"mini-system-btn synth-btn\" data-synthesize=\"${esc(item.id)}\" ${syn.can?'':'disabled'}>合成 ${Math.min(3,syn.count)}/3</button>`:''}",
          "${!['legendary','mythic'].includes(item.quality)?`<button class=\"mini-system-btn synth-btn\" data-synthesize=\"${esc(item.id)}\" ${syn.can?'':'disabled'}>合成 ${Math.min(3,syn.count)}/3</button>`:''}",
          'hide mythic synthesis')
          old_reward="function rewardStage(){if(run.stageRewarded)return run.lastReward;run.stageRewarded=true;const tower=run.mode==='tower',floor=run.towerFloor||1;run.lastReward=addXp(tower?100+floor*15:80+run.stageIndex*25);run.lastLoot=null;run.lastCrystals=0;if(meta.authMode!=='guest'){if(tower){const bonus=floor===10?8:floor===5?5:1;let next=cleanRpg(meta.rpg);next.crystals+=bonus;meta.rpg=recordTowerFloor(next,floor);run.lastCrystals=bonus}const lootStage=tower?(floor%5===0?3:Math.min(3,Math.floor((floor-1)/3))):run.stageIndex,item=rollLoot(lootStage,run.level);if(item){meta.rpg=addLoot(meta.rpg,item);run.lastLoot=item}saveMeta()}return run.lastReward}"
          new_reward="function rewardStage(){if(run.stageRewarded)return run.lastReward;run.stageRewarded=true;const tower=run.mode==='tower',floor=run.towerFloor||1;run.lastReward=addXp(tower?100+floor*15:80+run.stageIndex*25);run.lastLoot=null;run.lastCrystals=0;if(meta.authMode!=='guest'){if(tower){const bonus=floor===10?8:floor===5?5:1;let next=cleanRpg(meta.rpg);next.crystals+=bonus;meta.rpg=recordTowerFloor(next,floor);run.lastCrystals=bonus}const boss=!tower&&run.stageIndex>=STAGES.length-1,mythicDrop=rollMythicLoot({boss,towerFloor:tower?floor:0,level:run.level}),lootStage=tower?(floor%5===0?3:Math.min(3,Math.floor((floor-1)/3))):run.stageIndex,item=mythicDrop||rollLoot(lootStage,run.level);if(item){meta.rpg=addLoot(meta.rpg,item);run.lastLoot=item}saveMeta()}return run.lastReward}"
          s=rep(s,old_reward,new_reward,'mythic reward source')
          s=rep(s,
          "function lootHtml(){const item=run?.lastLoot;if(!item)return '';const q=QUALITY[item.quality]?.name||'';return `<div class=\"loot-reward quality-border-${esc(item.quality)}\">${lootArt(item,'loot-reward-art')}<div class=\"loot-reward-copy\"><b>${esc(q)}掉寶</b><span>${esc(item.name)}</span><small>${esc(itemBonusText(item))}</small></div></div>`}",
          "function lootHtml(){const item=run?.lastLoot;if(!item)return '';const q=QUALITY[item.quality]?.name||'',title=item.quality==='mythic'?'神話降臨':`${q}掉寶`;return `<div class=\"loot-reward quality-border-${esc(item.quality)} ${item.quality==='mythic'?'mythic-loot':''}\">${lootArt(item,'loot-reward-art')}<div class=\"loot-reward-copy\"><b>${esc(title)}</b><span>${esc(item.name)}</span><small>${esc(itemBonusText(item))}</small></div></div>`}",
          'mythic loot result')
          p.write_text(s)

          # styles.css
          p=Path('src/styles.css'); s=p.read_text()
          s=rep(s,
          ".quality-common{color:#666963}.quality-rare{color:#55758a}.quality-epic{color:#735f88}.quality-legendary{color:#9b6e25}.quality-border-common{border-color:#a9aaa5}.quality-border-rare{border-color:#7f9dad}.quality-border-epic{border-color:#9a83aa}.quality-border-legendary{border-color:#c49b4a}",
          ".quality-common{color:#666963}.quality-rare{color:#55758a}.quality-epic{color:#735f88}.quality-legendary{color:#9b6e25}.quality-mythic{color:#8c4f96;text-shadow:0 0 10px rgba(151,86,163,.22)}.quality-border-common{border-color:#a9aaa5}.quality-border-rare{border-color:#7f9dad}.quality-border-epic{border-color:#9a83aa}.quality-border-legendary{border-color:#c49b4a}.quality-border-mythic{border-color:#b26bb9!important;box-shadow:0 0 0 1px rgba(193,130,201,.18),0 8px 24px rgba(105,69,118,.18)}",
          'mythic quality css')
          s += "\n/* MYTHIC_EQUIPMENT_V1 */\n.mythic-loot{background:linear-gradient(135deg,#eee5ec,#f4efe5);box-shadow:0 0 0 2px rgba(174,102,183,.18),0 12px 28px rgba(85,62,93,.18)}.mythic-loot .loot-reward-art{filter:drop-shadow(0 0 12px rgba(166,99,177,.38))}.mythic-loot .loot-reward-copy>b{color:#774b7f;font-size:20px}.collection-card.quality-border-mythic.owned{background:linear-gradient(145deg,#eee6ed,#f1ece2)}\n"
          p.write_text(s)

          # tests
          p=Path('tests/rpg-systems.mjs'); s=p.read_text()
          s=rep(s,
          "import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,synthesisInfo,synthesizeItem,equipmentResonance,collectionEntries,collectionProgress,crystallizeItem,petSkillEffects,recordTowerFloor} from '../src/rpg.js';",
          "import {emptyRpg,cleanRpg,rollLoot,rollMythicLoot,addLoot,equipItem,synthesisInfo,synthesizeItem,equipmentResonance,collectionEntries,collectionProgress,crystallizeItem,petSkillEffects,recordTowerFloor,mythicEquipmentEffects} from '../src/rpg.js';",
          'test imports')
          s=rep(s,"assert.equal(collectionEntries().length,24);","assert.equal(collectionEntries().length,30);",'collection total test')
          s=s.replace("console.log('RPG systems OK');", """const noMyth=rollMythicLoot({boss:false,towerFloor:7,level:50},seq([0,.1]));assert.equal(noMyth,null);\nconst bossMyth=rollMythicLoot({boss:true,level:50},seq([.01,.01]));assert.equal(bossMyth.quality,'mythic');assert.equal(synthesisInfo(addLoot(emptyRpg(),bossMyth),bossMyth.id).can,false);\nlet myth=addLoot(emptyRpg(),bossMyth);myth=equipItem(myth,bossMyth.id);assert.ok(mythicEquipmentEffects(myth).redAmp>0);\nconst highTower=rollMythicLoot({towerFloor:10,level:50},seq([.05,.9]));assert.equal(highTower.quality,'mythic');\nconsole.log('RPG systems OK');""")
          p.write_text(s)
          PY
      - name: Verify mythic system
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js; do node --check "$f"; done
          npm test
          grep -Fq "mythic:{name:'神話'" src/rpg.js
          grep -Fq 'rollMythicLoot' src/rpg.js
          grep -Fq 'MYTHIC_ABILITIES' src/rpg.js
          grep -Fq '神話降臨' src/game.js
          grep -Fq 'quality-border-mythic' src/styles.css
      - name: Commit source only
        shell: bash
        run: |
          set -e
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git add src/rpg.js src/cards.js src/game.js src/styles.css tests/rpg-systems.mjs
          git commit -m 'feat: add mythic equipment drops and powers'
          git push
