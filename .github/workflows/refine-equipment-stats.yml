name: Refine equipment and battle UI
on:
  push:
    paths:
      - '.github/workflows/refine-equipment-stats.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        run: python3 .github/refine-equipment.py
      - name: Verify
        run: |
          node --check src/rpg.js
          node --check src/game.js
          node --check src/pk.js
          grep -q "rings.length>=2" src/game.js
          grep -q "equipmentGroup('戒指','rings'" src/game.js
          ! grep -q '<h1>裝備</h1>' src/game.js
          ! grep -q '<h1>寵物技能</h1>' src/game.js
          grep -q "爆擊率" src/game.js
          grep -q "爆擊率" src/pk.js
          grep -q "mini-card .exclusive-card-art img{width:84%" src/styles.css
      - name: Commit source changes and clean temporary files
        run: |
          git config user.name "redfisharthur-beep"
          git config user.email "redfisharthur@gmail.com"
          git rm .github/workflows/refine-equipment-stats.yml .github/refine-equipment.py
          git add src/rpg.js src/game.js src/pk.js src/styles.css
          git commit -m "ui: refine equipment pet tree and battle stats"
          git push
