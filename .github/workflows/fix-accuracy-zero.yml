name: Enforce zero accuracy multiplier
on:
  push:
    paths:
      - '.github/workflows/fix-accuracy-zero.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/rpg.js');s=p.read_text()
          s=s.replace("0 題答對時保底效果 +5%","1 題答對時效果 +5%").replace("0 題答對時保底效果再 +10%","1 題答對時效果再 +10%").replace('zeroAccuracy:0','oneAccuracy:0').replace('out.zeroAccuracy+=.05','out.oneAccuracy+=.05').replace('out.zeroAccuracy+=.10','out.oneAccuracy+=.10')
          p.write_text(s)
          p=Path('src/cards.js');s=p.read_text()
          old="export function accuracyMultiplier(correct,actor=null){if(correct===3)return 1.5;if(correct===2)return 1.15;if(correct===1)return .65;if(actor?.pet==='owl'){const fx=petSkillEffects(actor.pet,actor.rpg||{});return .25+fx.zeroAccuracy}return 0;}"
          new="export function accuracyMultiplier(correct,actor=null){if(correct===3)return 1.5;if(correct===2)return 1.15;if(correct===1){const fx=actor?.pet==='owl'?petSkillEffects(actor.pet,actor.rpg||{}):null;return .65+(fx?.oneAccuracy||0)}return 0;}"
          if old not in s: raise SystemExit('accuracy target missing')
          s=s.replace(old,new,1)
          s=s.replace("if(correct===0&&actor?.pet==='owl')logs.push('夜梟洞察：保留 25% 效果');","")
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/rpg.js
          node --check src/cards.js
      - name: Verify
        run: |
          grep -q "return .65+(fx?.oneAccuracy||0)" src/cards.js
          grep -q "return 0;}" src/cards.js
      - name: Commit
        run: |
          git config user.name "redfisharthur-beep"
          git config user.email "redfisharthur@gmail.com"
          git rm .github/workflows/fix-accuracy-zero.yml
          git add src/rpg.js src/cards.js
          git commit -m "fix: keep zero correct answers at zero multiplier"
          git push
