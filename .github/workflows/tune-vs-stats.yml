name: Tune VS and combat stats
on:
  push:
    paths:
      - '.github/workflows/tune-vs-stats.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch original CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/styles.css')
          s=p.read_text()
          reps=[
            ('.battle-stat-line b{font-size:15px;text-align:right;white-space:nowrap}', '.battle-stat-line b{font-size:19px;text-align:right;white-space:nowrap}'),
            ('.battle-center{margin-top:24px}.battle-center img{width:min(52px,100%)!important}', '.battle-center{margin-top:56px}.battle-center img{width:min(70px,100%)!important}'),
            ('.stat-row .battle-stat-line{grid-template-columns:34px minmax(42px,auto);gap:6px}', '.stat-row .battle-stat-line{grid-template-columns:34px minmax(62px,auto);gap:7px}'),
            ('.stat-row .shield-stat{grid-template-columns:34px minmax(42px,auto)}', '.stat-row .shield-stat{grid-template-columns:34px minmax(62px,auto)}'),
            ('.battle-stat-line b{font-size:13px}', '.battle-stat-line b{font-size:18px}')
          ]
          for old,new in reps:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -Fq '.battle-center{margin-top:56px}.battle-center img{width:min(70px,100%)!important}' src/styles.css
          grep -Fq '.battle-stat-line b{font-size:19px;text-align:right;white-space:nowrap}' src/styles.css
          grep -Fq '.battle-stat-line b{font-size:18px}' src/styles.css
          grep -Fq 'grid-template-columns:34px minmax(62px,auto);gap:7px' src/styles.css
          node --check src/game.js
          node --check src/pk.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git add src/styles.css
          git commit -m 'fix: enlarge VS and combat stat numbers'
          git push
          git rm .github/workflows/tune-vs-stats.yml
          git commit -m 'chore: remove completed VS stat tuning workflow'
          git push
