name: Auto duel and mobile UI
on:
  push:
    paths:
      - '.github/workflows/auto-duel-mobile-ui.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source update
        run: python .github/scripts/auto_duel_patch.py
      - name: Syntax check
        run: |
          node --check src/game.js
          node --check src/pk.js
          node --check worker/index.js
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/auto-duel-mobile-ui.yml .github/scripts/auto_duel_patch.py
          git add src/game.js src/pk.js src/styles.css worker/index.js
          git commit -m "game: auto duel after cards and compact mobile battle UI"
          git push
