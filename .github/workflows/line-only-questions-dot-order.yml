name: LINE-only daily questions and dot order
on:
  push:
    paths:
      - '.github/workflows/line-only-questions-dot-order.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Daily non-repeat identity: LINE session only. Guests get fresh random batches without persistence.
          p=Path('worker/index.js')
          s=p.read_text()
          old="async function questionIdentityKeys(request,env){const keys=[],session=await readSession(request,env);if(session?.sub)keys.push(`line:${session.sub}`);const ip=(request.headers.get('CF-Connecting-IP')||(request.headers.get('X-Forwarded-For')||'').split(',')[0]||'').trim();if(ip)keys.push(`ip:${await sha256Base64Url(ip)}`);if(!keys.length)keys.push(`ip:${await sha256Base64Url('unknown')}`);return [...new Set(keys)];}"
          new="async function questionIdentityKeys(request,env){const session=await readSession(request,env);return session?.sub?[`line:${session.sub}`]:[];}"
          if s.count(old)!=1: raise SystemExit(f'questionIdentityKeys expected 1 match, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Card order markers: 1/2/3 dots instead of stars.
          for filename in ['src/game.js','src/pk.js']:
              p=Path(filename); s=p.read_text()
              a=s.count("'★'.repeat(order)")
              b=s.count("'★'.repeat(i+1)")
              if a!=1 or b!=1: raise SystemExit(f'{filename}: expected star markers 1/1, got {a}/{b}')
              s=s.replace("'★'.repeat(order)","'•'.repeat(order)",1)
              s=s.replace("'★'.repeat(i+1)","'•'.repeat(i+1)",1)
              p.write_text(s)
          PY
      - name: Verify
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js tests/*.mjs; do node --check "$f"; done
          npm test
          grep -Fq 'async function questionIdentityKeys(request,env){const session=await readSession(request,env);' worker/index.js
          grep -Fq 'line:${session.sub}' worker/index.js
          ! grep -Fq 'CF-Connecting-IP' worker/index.js
          ! grep -Fq 'X-Forwarded-For' worker/index.js
          ! grep -Fq 'ip:${' worker/index.js
          grep -Fq "'•'.repeat(order)" src/game.js
          grep -Fq "'•'.repeat(i+1)" src/game.js
          grep -Fq "'•'.repeat(order)" src/pk.js
          grep -Fq "'•'.repeat(i+1)" src/pk.js
          ! grep -Fq "'★'.repeat(order)" src/game.js
          ! grep -Fq "'★'.repeat(order)" src/pk.js
      - name: Commit source
        shell: bash
        run: |
          git config user.name "openai-workflow"
          git config user.email "actions@users.noreply.github.com"
          git add worker/index.js src/game.js src/pk.js
          git diff --cached --quiet && exit 1
          git commit -m "feat: bind daily questions to LINE and use dot card order"
          git push origin HEAD:main
