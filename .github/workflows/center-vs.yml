name: Center VS icon
on:
  push:
    paths:
      - '.github/workflows/center-vs.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/styles.css')
          s=p.read_text()
          old='.battle-center{text-align:center;align-self:center;display:grid;gap:5px;z-index:2}'
          new='.battle-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:grid;place-items:center;gap:5px;z-index:2;pointer-events:none}'
          n=s.count(old)
          if n!=1:
              raise SystemExit(f'expected 1 battle-center rule, got {n}')
          p.write_text(s.replace(old,new))
          PY
      - name: Verify
        shell: bash
        run: |
          grep -Fq '.battle-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);' src/styles.css
          node --check src/game.js
          node --check src/pk.js
      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git rm .github/workflows/center-vs.yml
          git add src/styles.css
          git commit -m 'ui: center VS icon in battle stage'
          git push
