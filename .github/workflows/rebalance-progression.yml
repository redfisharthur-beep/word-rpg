name: Rebalance progression
on:
  push:
    paths:
      - '.github/workflows/rebalance-progression.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # src/assets.js
          p = Path('src/assets.js')
          s = p.read_text()
          old = "ui:{fight:'/images/fight.png',pk:'/images/PK.png',back:'/images/return.png',vs:'/images/VS.png',confirm:'/images/confirm.png',victor:'/images/victor.png',fail:'/images/fail.png',hp:'/images/HP.png',atk:'/images/ATK.png',def:'/images/DEF.png',crit:'/images/Crit.png'},"
          new = "ui:{fight:'/images/fight.png',pk:'/images/PK.png',back:'/images/return.png',vs:'/images/VS.png',confirm:'/images/confirm.png',victor:'/images/victor.png',fail:'/images/fail.png',levelUp:'/images/level%20up.png',hp:'/images/HP.png',atk:'/images/ATK.png',def:'/images/DEF.png',crit:'/images/Crit.png'},"
          if old not in s: raise SystemExit('assets ui target not found')
          p.write_text(s.replace(old,new,1))

          # src/cards.js
          p = Path('src/cards.js')
          s = p.read_text()
          skills = """const ROLE_SKILLS={
            warrior:[
              {level:10,id:'warrior-10',name:'震嶽斬',color:'red',text:'155%重擊',fx:{damage:1.55}},
              {level:20,id:'warrior-20',name:'不屈戰魂',color:'green',text:'回血28%＋護盾10%',fx:{healMax:.28,shieldMax:.10}},
              {level:30,id:'warrior-30',name:'王者壁壘',color:'blue',text:'護盾45%＋防禦+20%',fx:{shieldMax:.45,defBuff:.20}},
              {level:40,id:'warrior-40',name:'守護反擊',color:'blue',text:'135%傷害＋護盾25%',fx:{damage:1.35,shieldMax:.25}},
              {level:50,id:'warrior-50',name:'天崩地裂',color:'red',text:'260%終極傷害',fx:{damage:2.60}}
            ],
            mage:[
              {level:10,id:'mage-10',name:'炎爆術',color:'yellow',text:'155%火焰傷害',fx:{damage:1.55}},
              {level:20,id:'mage-20',name:'奧術回復',color:'green',text:'回血35%',fx:{healMax:.35}},
              {level:30,id:'mage-30',name:'魔法障壁',color:'blue',text:'護盾50%',fx:{shieldMax:.50}},
              {level:40,id:'mage-40',name:'星隕術',color:'yellow',text:'205%星隕傷害',fx:{damage:2.05}},
              {level:50,id:'mage-50',name:'終焉魔導',color:'yellow',text:'285%終極傷害',fx:{damage:2.85}}
            ],
            archer:[
              {level:10,id:'archer-10',name:'雙星連射',color:'red',text:'2連擊・每擊82%',fx:{hits:[.82,.82]}},
              {level:20,id:'archer-20',name:'回風步',color:'green',text:'85%傷害＋回血20%',fx:{damage:.85,healMax:.20}},
              {level:30,id:'archer-30',name:'暴雨箭陣',color:'red',text:'3連擊・每擊65%',fx:{hits:[.65,.65,.65]}},
              {level:40,id:'archer-40',name:'風神護佑',color:'green',text:'回血28%＋護盾15%',fx:{healMax:.28,shieldMax:.15}},
              {level:50,id:'archer-50',name:'天穹一箭',color:'red',text:'300%終極傷害',fx:{damage:3.00}}
            ]
          };"""
          s,n = re.subn(r"const ROLE_SKILLS=\{.*?\n\};\nexport function unlockedRoleSkills", skills + "\nexport function unlockedRoleSkills", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('ROLE_SKILLS target not found')
          old = """export function dealHand(n=9,role=null,level=1){
            const hand=Array.from({length:n},randomCard),skills=role?unlockedRoleSkills(role,level):[];
            if(hand.length&&skills.length){const skill=skills[rnd(0,skills.length-1)],at=rnd(0,hand.length-1);hand[at]={...skill,uid:crypto.randomUUID(),kind:'exclusive',exclusive:true,role};}
            return hand;
          }"""
          new = """export function dealHand(n=9,role=null,level=1){
            const lv=clamp(Math.round(Number(level)||1),1,50),skills=role?unlockedRoleSkills(role,lv):[];
            let exclusiveCount=role?(lv>=50?3:lv>=30?2:lv>=10?1:0):0;
            exclusiveCount=Math.min(n,exclusiveCount,skills.length);
            const hand=Array.from({length:n-exclusiveCount},randomCard),pool=[...skills];
            for(let i=0;i<exclusiveCount;i++){const at=rnd(0,pool.length-1),skill=pool.splice(at,1)[0];hand.push({...skill,uid:crypto.randomUUID(),kind:'exclusive',exclusive:true,role});}
            for(let i=hand.length-1;i>0;i--){const j=rnd(0,i);[hand[i],hand[j]]=[hand[j],hand[i]];}
            return hand;
          }"""
          if old not in s: raise SystemExit('dealHand target not found')
          p.write_text(s.replace(old,new,1))

          # src/game.js
          p = Path('src/game.js')
          s = p.read_text()
          old = "function xpNeed(level=meta.level){return 120+Math.max(0,level-1)*80}"
          new = "function xpNeed(level=meta.level){return 60+Math.max(0,level-1)*12}"
          if old not in s: raise SystemExit('xpNeed target not found')
          s = s.replace(old,new,1)

          stage_pat = r"function stage\(\)\{const s=rawStage\(\),lv=run\?\.level\|\|meta\.level,hp=1\+\(lv-1\)\*\.055,atk=1\+\(lv-1\)\*\.035,def=1\+\(lv-1\)\*\.03;let extra='';"
          stage_repl = "function stage(){const s=rawStage(),lv=run?.level||meta.level,high=Math.max(0,lv-20),hp=1+(lv-1)*.06+high*.008,atk=1+(lv-1)*.04+high*.006,def=1+(lv-1)*.035+high*.005;let extra='';"
          s,n = re.subn(stage_pat,stage_repl,s,count=1)
          if n != 1: raise SystemExit('stage scaling target not found')

          old = "${r.levels.length?`<strong>LEVEL UP</strong>`:''}"
          new = "${r.levels.length?uiImg(ASSETS.ui.levelUp,'升級','display:block;width:min(230px,62vw);max-height:100px;object-fit:contain;margin:8px auto 0;'):''}"
          if old not in s: raise SystemExit('LEVEL UP target not found')
          s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/assets.js
          node --check src/cards.js
          node --check src/game.js
          node --check src/pk.js
          node --check worker/index.js
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebalance-progression.yml
          git add src/assets.js src/cards.js src/game.js
          git commit -m "feat: rebalance leveling monsters and exclusive skill hands"
          git push
