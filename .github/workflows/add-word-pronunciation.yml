name: Add automatic word pronunciation
on:
  push:
    paths:
      - '.github/workflows/add-word-pronunciation.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        run: |
          python - <<'PY'
          from pathlib import Path

          # src/game.js
          p=Path('src/game.js')
          s=p.read_text()
          old="let meta=loadMeta(),screen='home',run=null,pkMode=null,actionTimer=null,selectTimeout=null,selectTicker=null,questionTimeout=null,questionTicker=null,answerFeedback=null;"
          new="let meta=loadMeta(),screen='home',run=null,pkMode=null,actionTimer=null,selectTimeout=null,selectTicker=null,questionTimeout=null,questionTicker=null,answerFeedback=null,spokenQuestionKey='';"
          if old not in s: raise SystemExit('game state target not found')
          s=s.replace(old,new,1)
          old="const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));"
          new=old+"\nfunction speakEnglishOnce(word,key){if(!word||!key||spokenQuestionKey===key||!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;spokenQuestionKey=key;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(word));u.lang='en-US';u.rate=.9;u.pitch=1;u.volume=1;window.speechSynthesis.speak(u)}catch{}}"
          if old not in s: raise SystemExit('game esc target not found')
          s=s.replace(old,new,1)
          old="function startQuestionTimer(){clearTimeout(questionTimeout);clearInterval(questionTicker);run.questionDeadline=Date.now()+10000;questionTimeout=setTimeout(()=>answer(null,true),10000)}"
          new="function startQuestionTimer(){clearTimeout(questionTimeout);clearInterval(questionTicker);const cur=run.qs?.[run.qIndex];speakEnglishOnce(cur?.word,`solo:${run.quizStarted}:${run.qIndex}:${cur?.word||''}`);run.questionDeadline=Date.now()+10000;questionTimeout=setTimeout(()=>answer(null,true),10000)}"
          if old not in s: raise SystemExit('game timer target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # src/pk.js
          p=Path('src/pk.js')
          s=p.read_text()
          old="  let socket=null,alive=false,status='idle',round=1,hand=[],used=[],selected=[],qs=[],qIndex=0,correct=0,started=0,me=null,opponent=null,last=null,stepIndex=0,stepTimer=null,selectDeadline=0,selectTimeout=null,selectTicker=null,questionDeadline=0,questionTimeout=null,answerFeedback=null;"
          new="  let socket=null,alive=false,status='idle',round=1,hand=[],used=[],selected=[],qs=[],qIndex=0,correct=0,started=0,me=null,opponent=null,last=null,stepIndex=0,stepTimer=null,selectDeadline=0,selectTimeout=null,selectTicker=null,questionDeadline=0,questionTimeout=null,answerFeedback=null,spokenQuestionKey='';"
          if old not in s: raise SystemExit('pk state target not found')
          s=s.replace(old,new,1)
          old="  const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));"
          new=old+"\n  function speakEnglishOnce(word,key){if(!word||!key||spokenQuestionKey===key||!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;spokenQuestionKey=key;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(word));u.lang='en-US';u.rate=.9;u.pitch=1;u.volume=1;window.speechSynthesis.speak(u)}catch{}}"
          if old not in s: raise SystemExit('pk esc target not found')
          s=s.replace(old,new,1)
          old="  function startQuestionTimer(){clearTimeout(questionTimeout);questionDeadline=Date.now()+10000;questionTimeout=setTimeout(()=>answer(null,true),10000)}"
          new="  function startQuestionTimer(){clearTimeout(questionTimeout);const cur=qs?.[qIndex];speakEnglishOnce(cur?.word,`pk:${started}:${qIndex}:${cur?.word||''}`);questionDeadline=Date.now()+10000;questionTimeout=setTimeout(()=>answer(null,true),10000)}"
          if old not in s: raise SystemExit('pk timer target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/game.js
          node --check src/pk.js
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-word-pronunciation.yml
          git add src/game.js src/pk.js
          git commit -m "feat: auto pronounce each English quiz word once"
          git push
