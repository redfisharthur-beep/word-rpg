name: Wire loot art
on:
  push:
    paths:
      - '.github/workflows/wire-loot-art.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/game.js')
          s=p.read_text()
          old="import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,itemBonusText,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills} from './rpg.js';"
          new="import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,itemBonusText,lootImage,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills} from './rpg.js';"
          assert old in s
          s=s.replace(old,new,1)
          marker="function renderHome(){"
          assert marker in s
          helper="function lootArt(item,className='loot-art'){const src=item?.art||lootImage(item);return src?`<img class=\"${esc(className)}\" src=\"${esc(src)}\" alt=\"${esc(item?.name||'裝備')}\" decoding=\"async\">`:''}\n"
          s=s.replace(marker,helper+marker,1)
          s,n=re.subn(r'^function equipmentSlot\(label,id\).*$',"function equipmentSlot(label,id){const item=meta.rpg.inventory.find(x=>x.id===id);return `<div class=\"equip-slot\"><b>${esc(label)}</b>${item?`${lootArt(item,'equip-art')}<span class=\"quality-${esc(item.quality)}\">${esc(item.name)}</span><small>${esc(itemBonusText(item))}</small><button class=\"mini-system-btn\" data-unequip=\"${esc(item.id)}\">卸下</button>`:'<span>—</span>'}</div>`}",s,count=1,flags=re.M);assert n==1
          s,n=re.subn(r'^function renderEquipment\(\).*$',"function renderEquipment(){const eq=meta.rpg.equipped,equipped=new Set([...eq.gems,eq.armor,eq.ring].filter(Boolean)),items=[...meta.rpg.inventory].reverse();return `<main class=\"setup-screen system-screen\"><section class=\"system-card\"><div class=\"system-head\"><button class=\"text-btn\" data-action=\"setup-back\">返回</button><h1>裝備</h1><span></span></div><div class=\"equip-grid\">${[0,1,2].map(i=>equipmentSlot(`寶石 ${i+1}`,eq.gems[i])).join('')}${equipmentSlot('裝甲',eq.armor)}${equipmentSlot('戒指',eq.ring)}</div><div class=\"inventory-list\">${items.length?items.map(item=>{const on=equipped.has(item.id),gemFull=item.type==='gem'&&eq.gems.length>=3&&!on;return `<div class=\"loot-item quality-border-${esc(item.quality)}\">${lootArt(item)}<div><b class=\"quality-${esc(item.quality)}\">${esc(item.name)}</b><small>${esc(itemBonusText(item))}</small></div><button class=\"mini-system-btn\" ${on?'data-unequip':'data-equip'}=\"${esc(item.id)}\" ${gemFull?'disabled':''}>${on?'卸下':'裝備'}</button></div>`}).join(''):'<div class=\"empty-system\">尚未獲得裝備</div>'}</div></section></main>`}",s,count=1,flags=re.M);assert n==1
          s,n=re.subn(r'^function lootHtml\(\).*$',"function lootHtml(){const item=run?.lastLoot;if(!item)return '';const q=QUALITY[item.quality]?.name||'';return `<div class=\"loot-reward quality-border-${esc(item.quality)}\">${lootArt(item,'loot-reward-art')}<div class=\"loot-reward-copy\"><b>${esc(q)}掉寶</b><span>${esc(item.name)}</span><small>${esc(itemBonusText(item))}</small></div></div>`}",s,count=1,flags=re.M);assert n==1
          p.write_text(s)

          p=Path('src/styles.css')
          s=p.read_text()
          old=".equip-slot{min-height:118px;background:#ebe4da;border-radius:16px;padding:10px;display:grid;align-content:center;gap:5px;text-align:center}"
          new=old+".equip-art{display:block;width:74px;height:74px;object-fit:contain;margin:0 auto;filter:drop-shadow(0 7px 8px rgba(48,54,51,.16))}"
          assert old in s
          s=s.replace(old,new,1)
          old=".loot-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;background:#f3efe8;border-left:5px solid #b8b2aa}"
          new=".loot-item{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;background:#f3efe8;border-left:5px solid #b8b2aa}.loot-art{display:block;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 7px rgba(48,54,51,.16))}"
          assert old in s
          s=s.replace(old,new,1)
          old=".loot-reward{width:min(360px,100%);margin:8px auto 14px;padding:12px 16px;border-radius:16px;border:2px solid;background:#f4efe7;display:grid;gap:4px}.loot-reward b{font-size:18px}.loot-reward span{font-size:20px}.loot-reward small{font-size:14px}"
          new=".loot-reward{width:min(390px,100%);margin:8px auto 14px;padding:12px 16px;border-radius:16px;border:2px solid;background:#f4efe7;display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:center}.loot-reward-art{display:block;width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 8px 9px rgba(48,54,51,.18))}.loot-reward-copy{display:grid;gap:4px}.loot-reward b{font-size:18px}.loot-reward span{font-size:20px}.loot-reward small{font-size:14px}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/rpg.js
          node --check src/game.js
      - name: Verify new loot pool and art
        run: |
          grep -q "pick(\['ruby','thunder'\]" src/rpg.js
          grep -q "pick(\['guardian','bloodspirit'\]" src/rpg.js
          grep -q "pick(\['warbreaker','battlesoul'\]" src/rpg.js
          grep -q "loot-reward-art" src/game.js
          grep -q "loot-art" src/styles.css
          test -f images/loot-gem-ruby-common.png
          test -f images/loot-gem-thunder-legendary.png
          test -f images/loot-armor-guardian-common.png
          test -f images/loot-armor-bloodspirit-legendary.png
          test -f images/loot-ring-warbreaker-common.png
          test -f images/loot-ring-battlesoul-legendary.png
      - name: Commit source changes and remove workflow
        run: |
          rm .github/workflows/wire-loot-art.yml
          git config user.name "redfisharthur-beep"
          git config user.email "redfisharthur@gmail.com"
          git add src/game.js src/styles.css .github/workflows/wire-loot-art.yml
          git commit -m "feat: show new loot art in drops and equipment" || exit 0
          git push
