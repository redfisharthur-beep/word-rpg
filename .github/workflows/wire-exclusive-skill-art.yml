name: Wire exclusive skill art
on:
  push:
    paths:
      - '.github/workflows/wire-exclusive-skill-art.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        run: python .github/scripts/wire_exclusive_skill_art.py
      - name: Syntax check
        run: |
          node --check src/game.js
          node --check src/pk.js
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-exclusive-skill-art.yml .github/scripts/wire_exclusive_skill_art.py
          git add src/game.js src/pk.js
          git commit -m "feat: use dedicated exclusive skill card art"
          git push
