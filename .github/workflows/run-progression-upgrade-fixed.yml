name: Run verified progression upgrade
on:
  push:
    paths:
      - '.github/workflows/run-progression-upgrade-fixed.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run existing progression patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/upgrade-progression-systems.yml').read_text()
          anchor=src.index('      - name: Patch source')
          marker='        run: |\n'
          start=src.index(marker,anchor)+len(marker)
          end=src.index('      - name: Verify',start)
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/progression-patch.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/progression-patch.sh
      - name: Normalize generated test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/rpg-systems.mjs')
          p.write_text(p.read_text().replace('\\n','\n'))
          PY
      - name: Verify all progression systems
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js; do node --check "$f"; done
          npm test
          grep -Fq 'TOWER_MAX=10' src/game.js
          grep -Fq "screen==='collection'" src/game.js
          grep -Fq '烈戰共鳴' src/rpg.js
          grep -Fq '九尾覺醒' src/rpg.js
          grep -Fq 'collection:[]' src/rpg.js
      - name: Commit source only
        shell: bash
        run: |
          set -e
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git add src/rpg.js src/cards.js src/game.js src/styles.css tests/rpg-systems.mjs package.json
          git commit -m 'feat: deepen RPG progression systems'
          git push
