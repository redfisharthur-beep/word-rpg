name: Update owl 3-of-5 skill threshold

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-owl-high-accuracy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update source rules
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected=1):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:90]}')
              return text.replace(old, new)

          rpg_path = Path('src/rpg.js')
          rpg = rpg_path.read_text()
          rpg = replace_exact(rpg,
              "{id:'owl-1',name:'夜視洞察',cost:2,desc:'1 題答對時效果 +5%'}",
              "{id:'owl-1',name:'夜視洞察',cost:2,desc:'答對 3/5 以上時效果 +5%'}")
          rpg = replace_exact(rpg,
              "{id:'owl-4',name:'智者回響',cost:8,desc:'1 題答對時效果再 +10%'}",
              "{id:'owl-4',name:'智者回響',cost:8,desc:'答對 3/5 以上時效果再 +10%'}")
          rpg = replace_exact(rpg,
              "owl:{name:'星夜覺醒',desc:'1 題答對效果再 +10%，綠／藍牌續航再 +5%'}",
              "owl:{name:'星夜覺醒',desc:'答對 3/5 以上效果再 +10%，綠／藍牌續航再 +5%'}")
          if rpg.count('oneAccuracy') != 4:
              raise SystemExit(f"Expected 4 oneAccuracy refs in rpg.js, found {rpg.count('oneAccuracy')}")
          rpg = rpg.replace('oneAccuracy', 'highAccuracy')
          rpg_path.write_text(rpg)

          cards_path = Path('src/cards.js')
          cards = cards_path.read_text()
          old = "export function accuracyMultiplier(correct,actor=null){const n=Math.max(0,Math.min(5,Math.round(Number(correct)||0)));if(actor?.pet==='owl'){if(n===5)return 1.7;if(n===4)return 1.5;if(n===3)return 1.32;if(n===2)return 1.15;if(n===1){const fx=petSkillEffects(actor.pet,actor.rpg||{});return .9+(fx?.oneAccuracy||0)}return .65;}if(n===5)return 1.5;if(n===4)return 1.32;if(n===3)return 1.15;if(n===2)return .9;if(n===1)return .65;return 0;}"
          new = "export function accuracyMultiplier(correct,actor=null){const n=Math.max(0,Math.min(5,Math.round(Number(correct)||0)));if(actor?.pet==='owl'){const fx=petSkillEffects(actor.pet,actor.rpg||{}),highBonus=n>=3?(fx?.highAccuracy||0):0;if(n===5)return 1.7+highBonus;if(n===4)return 1.5+highBonus;if(n===3)return 1.32+highBonus;if(n===2)return 1.15;if(n===1)return .9;return .65;}if(n===5)return 1.5;if(n===4)return 1.32;if(n===3)return 1.15;if(n===2)return .9;if(n===1)return .65;return 0;}"
          cards = replace_exact(cards, old, new)
          cards_path.write_text(cards)

          test_path = Path('tests/words.mjs')
          tests = test_path.read_text()
          old_test = "assert.ok(Math.abs(accuracyMultiplier(1,{pet:'owl',rpg:{petSkills:{owl:['owl-1']}}})-.95)<1e-9);"
          new_test = "const owlSkill={pet:'owl',rpg:{petSkills:{owl:['owl-1']}}};assert.equal(accuracyMultiplier(1,owlSkill),.9);assert.equal(accuracyMultiplier(2,owlSkill),1.15);assert.ok(Math.abs(accuracyMultiplier(3,owlSkill)-1.37)<1e-9);assert.ok(Math.abs(accuracyMultiplier(4,owlSkill)-1.55)<1e-9);assert.ok(Math.abs(accuracyMultiplier(5,owlSkill)-1.75)<1e-9);const owlFull={pet:'owl',rpg:{petSkills:{owl:['owl-1','owl-2','owl-3','owl-4','owl-5']},petEnhance:{owl:4}}};assert.equal(accuracyMultiplier(1,owlFull),.9);assert.ok(Math.abs(accuracyMultiplier(3,owlFull)-1.57)<1e-9);assert.ok(Math.abs(accuracyMultiplier(4,owlFull)-1.75)<1e-9);assert.ok(Math.abs(accuracyMultiplier(5,owlFull)-1.95)<1e-9);"
          tests = replace_exact(tests, old_test, new_test)
          test_path.write_text(tests)
          PY

      - name: Verify source and tests
        run: |
          node --check src/rpg.js
          node --check src/cards.js
          node --check src/game.js
          node --check src/pk.js
          node --check worker/index.js
          npm test
          ! grep -R "oneAccuracy" src tests
          ! grep -R "1 題答對時效果" src tests
          git diff --check
          grep -F "答對 3/5 以上時效果 +5%" src/rpg.js
          grep -F "答對 3/5 以上時效果再 +10%" src/rpg.js

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rpg.js src/cards.js tests/words.mjs
          git commit -m "feat: apply owl skill bonus at 3 of 5 or better"
          git push origin main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-owl-high-accuracy.yml
          git commit -m "chore: remove temporary owl threshold workflow"
          git push origin main
