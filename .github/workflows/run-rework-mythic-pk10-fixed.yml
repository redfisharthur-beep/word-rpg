name: Run fixed mythic PK10 upgrade
on:
  push:
    paths:
      - '.github/workflows/run-rework-mythic-pk10-fixed.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run original patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/rework-mythic-pk10.yml').read_text()
          anchor=src.index('      - name: Patch source')
          marker='        run: |\n'
          start=src.index(marker,anchor)+len(marker)
          end=src.index('      - name: Verify',start)
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/rework-patch.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/rework-patch.sh
      - name: Repair basic attack block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/cards.js'); s=p.read_text()
          block="""function basicAttack(actor,target,mult,logs,label){
            const fx=mythicEquipmentEffects(actor?.rpg||{});let hits=1;
            if(fx.flurry3Chance>0){const roll=Math.random();if(roll<fx.flurry3Chance)hits=3;else if(roll<fx.flurry3Chance+fx.flurry2Chance)hits=2;if(hits>1)logs.push(`無盡連斬：${hits}連擊`);}
            for(let i=0;i<hits&&actor.hp>0&&target.hp>0;i++)hit(actor,target,mult,logs,label,true);
          }
          export function resolveBasic(actor,target,correct){const logs=[];if(consumeStun(actor,logs))return logs;const p=accuracyMultiplier(correct,actor);if(p<=0){logs.push('失敗..凍結中');return logs;}basicAttack(actor,target,p,logs,'基本攻擊');return logs;}
          export function resolveAutoBasic(actor,target){const logs=[];if(consumeStun(actor,logs))return logs;basicAttack(actor,target,1,logs,'普通攻擊');return logs;}
          export function cardSummary"""
          out,n=re.subn(r"function basicAttack\(actor,target,mult,logs,label\)\{.*?export function cardSummary",block,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'basic block repair matches={n}')
          p.write_text(out)
          PY
      - name: Verify all changes
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js; do node --check "$f"; done
          npm test
          grep -Fq "lifesteal:{type:'gem'" src/rpg.js
          grep -Fq "antiheal:{type:'ring'" src/rpg.js
          grep -Fq "for(let autoRound=3;autoRound<=10" worker/index.js
          grep -Fq "round<=2?ra.selected" worker/index.js
          grep -Fq "rpg:meta.rpg" src/pk.js
          grep -Fq "第 ${esc(step.cycle||3)} 回合 · 普通攻擊" src/pk.js
          ! grep -Fq "mythic.redAmp" src/cards.js
          ! grep -Fq "firstOffensiveAmp" src/cards.js
      - name: Commit source only
        shell: bash
        run: |
          set -e
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git add src/rpg.js src/cards.js src/pk.js worker/index.js tests/rpg-systems.mjs
          git commit -m 'feat: direct mythic combat powers and ten-round PK'
          git push
