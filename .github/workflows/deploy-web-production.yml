name: Deploy Web Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tooling
        run: npm install --ignore-scripts

      - name: Sync shared game data
        run: npm run sync:data

      - name: Run original Web game tests
        run: npm test

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy original Web game
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live original Web game
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://word-rpg.redfisharthur.workers.dev"

          READY=0
          for ATTEMPT in {1..12}; do
            if curl --fail --silent --show-error "$BASE_URL/" -o /tmp/word-rpg-index.html; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" -eq 1

          grep -q 'src/game.js' /tmp/word-rpg-index.html
          if grep -q 'word-rpg-chunk-loader' /tmp/word-rpg-index.html; then
            echo "::error::Production is still serving the Godot loader"
            exit 1
          fi

          curl --fail --silent --show-error "$BASE_URL/src/game.js" -o /tmp/word-rpg-game.js
          test -s /tmp/word-rpg-game.js
          curl --fail --silent --show-error "$BASE_URL/api/session" -o /tmp/word-rpg-session.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const session = JSON.parse(fs.readFileSync('/tmp/word-rpg-session.json', 'utf8'));
          if (!session || typeof session !== 'object') {
            throw new Error('Live /api/session did not return JSON');
          }
          console.log('Original Web production smoke: PASS');
          NODE

      - name: Run live Web PK quiz-to-battle smoke
        env:
          WORD_RPG_BASE_URL: https://word-rpg.redfisharthur.workers.dev
        run: timeout 35s node scripts/live-web-pk-smoke.mjs
      - name: Validate four concurrent PK players
        env:
          WORD_RPG_BASE_URL: https://word-rpg.redfisharthur.workers.dev
        run: timeout 45s node scripts/live-pk-concurrency-smoke.mjs

      - name: Verify AI takeover after 60 seconds and finish quiz
        env:
          WORD_RPG_BASE_URL: https://word-rpg.redfisharthur.workers.dev
        run: timeout 110s node scripts/live-ai-pk-smoke.mjs
