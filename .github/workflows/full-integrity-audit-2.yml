name: Full integrity audit 2
on:
  push:
    paths:
      - '.github/workflows/full-integrity-audit-2.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run complete audit
        shell: bash
        run: |
          set +e
          for f in src/*.js worker/index.js; do node --check "$f" || exit 1; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {ASSETS} from './src/assets.js';
          import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,equipmentBonuses,crystalValue,crystallizeItem,petEnhanceCost,enhancePet,petEnhanceLevel,canUnlockPetSkill,unlockPetSkill,availableSkillPoints,PET_TREES,petSkillEffects} from './src/rpg.js';
          import {progressionStats,dealHand,makeFighter,accuracyMultiplier,resolveCardAction,afterAction,effectiveDef,resolveAutoBasic} from './src/cards.js';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const finiteF=f=>['hp','maxHp','atk','def','crit','shield'].every(k=>Number.isFinite(Number(f[k])));
          function seq(vals){let i=0;return ()=>vals[Math.min(i++,vals.length-1)]}
          function loot(q,type,sub=.1){const x=rollLoot(3,50,seq([0,q,type,sub]));assert(x,'loot generation failed');return x}
          // All declared/dynamic assets exist.
          const paths=[];const walk=o=>Object.values(o).forEach(v=>typeof v==='string'?paths.push(v):walk(v));walk(ASSETS);
          for(const role of ['warrior','mage','archer'])for(const lv of [10,20,30,40,50])paths.push(`/images/skill-${role}-${lv}.png`);
          for(const type of ['gem','armor','ring']){const subs=type==='gem'?['ruby','thunder']:type==='armor'?['guardian','bloodspirit']:['warbreaker','battlesoul'];for(const sub of subs)for(const q of ['common','rare','epic','legendary'])paths.push(`/images/loot-${type}-${sub}-${q}.png`)}
          const css=fs.readFileSync('src/styles.css','utf8');for(const m of css.matchAll(/url\(['\"]?(\/images\/[^)'\"]+)/g))paths.push(m[1]);
          for(const p of new Set(paths))assert(fs.existsSync('.'+decodeURIComponent(p)),`missing asset ${p}`);
          // 6 loot types x 4 qualities map correctly.
          const checks=[[.10,.10,.10,'普通紅曜石'],[.50,.10,.90,'稀有雷光石'],[.85,.70,.10,'史詩守護甲'],[.97,.70,.90,'傳說血靈甲'],[.97,.90,.10,'傳說破軍戒'],[.97,.90,.90,'傳說戰魂戒']];for(const [q,t,s,n] of checks)assert(loot(q,t,s).name===n,`loot map ${n}`);
          // Slot rules and equipment bonus validity.
          let r=emptyRpg();const gems=[loot(.1,.1,.1),loot(.5,.1,.1),loot(.85,.1,.9),loot(.97,.1,.9)],armor=[loot(.1,.7,.1),loot(.97,.7,.9)],rings=[loot(.1,.9,.1),loot(.5,.9,.9),loot(.97,.9,.1)];for(const x of [...gems,...armor,...rings])r=addLoot(r,x);for(const x of gems)r=equipItem(r,x.id);assert(r.equipped.gems.length===3,'gem slot limit');r=equipItem(r,armor[0].id);r=equipItem(r,armor[1].id);assert(r.equipped.armor===armor[1].id,'armor replacement');for(const x of rings)r=equipItem(r,x.id);assert(r.equipped.rings.length===2,'ring slot limit');assert(Object.values(equipmentBonuses(r)).every(Number.isFinite),'equipment bonus finite');
          // Equipped gear can never be crystallized or lost at 60 capacity.
          const equippedId=r.equipped.gems[0],before=r.crystals;r=crystallizeItem(r,equippedId);assert(r.crystals===before&&r.inventory.some(x=>x.id===equippedId),'equipped crystallize guard');
          let cap=emptyRpg();const anchor=loot(.97,.1,.1);cap=addLoot(cap,anchor);cap=equipItem(cap,anchor.id);for(let i=0;i<65;i++)cap=addLoot(cap,loot(.1,.9,i%2?.9:.1));assert(cap.inventory.length===60,'inventory cap exact');assert(cap.inventory.some(x=>x.id===anchor.id)&&cap.equipped.gems.includes(anchor.id),'equipped gear lost at cap');
          // Duplicate IDs clean safely.
          const dupe=loot(.5,.9,.1);let dirty=emptyRpg();dirty.inventory=[dupe,{...dupe,name:'tampered'}];dirty=cleanRpg(dirty);assert(dirty.inventory.filter(x=>x.id===dupe.id).length===1,'duplicate inventory id');
          // Crystal economy and pet enhancement.
          assert([1,3,8,20].every((v,i)=>crystalValue({quality:['common','rare','epic','legendary'][i]})===v),'crystal values');let pe=emptyRpg();pe.crystals=75;for(const cost of [5,10,20,40]){assert(petEnhanceCost('fox',pe)===cost,`enhance cost ${cost}`);pe=enhancePet('fox',pe)}assert(petEnhanceLevel('fox',pe)===4&&pe.crystals===0,'pet max');const p0=progressionStats('warrior','fox',50,emptyRpg()).total,p4=progressionStats('warrior','fox',50,{...emptyRpg(),petEnhance:{fox:4,owl:0,dragon:0}}).total;assert(p4.maxHp>p0.maxHp&&p4.atk>p0.atk&&p4.def>p0.def,'pet enhancement stats');
          // Shared skill budget and skill effects.
          let sk=emptyRpg();assert(!canUnlockPetSkill('fox','fox-2',50,sk),'skill prerequisite bypass');for(const n of PET_TREES.fox){assert(canUnlockPetSkill('fox',n.id,50,sk),`cannot unlock ${n.id}`);sk=unlockPetSkill('fox',n.id,50,sk)}assert(availableSkillPoints(50,sk)===19,'shared skill budget');assert(petSkillEffects('fox',sk).crit===.04,'fox skill effects');
          // Nine-card structure and exclusive counts.
          for(const [lv,count] of [[1,0],[9,0],[10,1],[29,1],[30,2],[49,2],[50,3]])for(let i=0;i<50;i++){const h=dealHand(9,'warrior',lv);assert(h.length===9,`hand size ${lv}`);assert(h.filter(x=>x.exclusive).length===count,`exclusive count ${lv}`);assert(new Set(h.filter(x=>x.exclusive).map(x=>x.id)).size===count,'duplicate exclusive')}
          assert(accuracyMultiplier(0)===0&&accuracyMultiplier(1)===.65&&accuracyMultiplier(2)===1.15&&accuracyMultiplier(3)===1.5,'accuracy multipliers');
          // Status duration and regen semantics.
          let a=makeFighter({def:100,defBoost:[{pct:2,turns:2,fresh:true}],crit:0}),b=makeFighter({crit:0});afterAction(a,b,[]);assert(a.defBoost[0]?.turns===2&&!a.defBoost[0]?.fresh,'fresh duration');afterAction(a,b,[]);assert(a.defBoost[0]?.turns===1,'duration turn1');afterAction(a,b,[]);assert(a.defBoost.length===0,'duration expiry');
          // Stress all roles/pets/levels with random cards.
          let stress=0;for(const role of ['warrior','mage','archer'])for(const pet of ['fox','owl','dragon'])for(const lv of [1,10,20,30,40,50])for(let sim=0;sim<80;sim++){const st=progressionStats(role,pet,lv,emptyRpg()).total,hero=makeFighter({...st,role,pet,rpg:emptyRpg(),crit:0}),enemy=makeFighter({maxHp:2600,hp:2600,atk:250,def:150,crit:0}),h=dealHand(9,role,lv);for(let i=0;i<9&&hero.hp>0&&enemy.hp>0;i++){resolveCardAction(hero,enemy,h[i],i%4,{cards:h.slice(Math.floor(i/3)*3,Math.floor(i/3)*3+3),slotIndex:i%3,speedWin:i%2===0});afterAction(hero,enemy,[]);assert(finiteF(hero)&&finiteF(enemy),'non-finite combat');assert(hero.hp>=0&&enemy.hp>=0&&hero.shield>=0&&enemy.shield>=0,'negative hp/shield');stress++}}
          // Auto-basic duel must terminate under representative high-level stats.
          for(const role of ['warrior','mage','archer']){const st=progressionStats(role,'fox',50,emptyRpg()).total,A=makeFighter({...st,role,crit:0}),B=makeFighter({...st,role:'monster',crit:0});let n=0;while(A.hp>0&&B.hp>0&&n<10000){resolveAutoBasic(n%2?B:A,n%2?A:B);n++}assert(n<10000,'auto duel non-terminating')}
          console.log(`AUDIT_OK stress_actions=${stress}`);
          NODE
          code=$?
          echo "$code" > /tmp/audit-exit
          exit 0
      - name: Remove audit workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git rm .github/workflows/full-integrity-audit-2.yml
          git commit -m 'chore: remove completed integrity audit workflow'
          git push
      - name: Report audit result
        if: always()
        shell: bash
        run: test "$(cat /tmp/audit-exit 2>/dev/null || echo 1)" -eq 0
