name: Validate Godot

on:
  push:
    branches: [godot-migration]
  pull_request:
    paths:
      - 'godot/**'
      - 'project.godot'
      - 'images/**'
      - 'data/game-data.json'

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.0'
          use-dotnet: false
          include-templates: false
      - name: Import project and validate scripts
        run: godot --headless --path . --editor --quit
      - name: Run Godot RPG parity tests
        run: godot --headless --path . --script res://godot/tests/rpg_parity_test.gd
      - name: Launch main scene smoke test
        run: godot --headless --path . --quit-after 3
      - name: Launch native PK scene smoke test
        run: godot --headless --path . res://godot/scenes/pk.tscn --quit-after 3
