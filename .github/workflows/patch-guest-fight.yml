name: Patch guest Fight entry

on:
  push:
    paths:
      - '.github/workflows/patch-guest-fight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update home entry logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game.js')
          text = path.read_text(encoding='utf-8')

          old = "function renderHome(){return `<main class=\"home-screen\"><section class=\"home-panel home-login\"><button class=\"line-image-btn\" data-action=\"guest-login\" aria-label=\"訪客進入\" style=\"background:rgba(255,255,255,.96);border-radius:50%;box-shadow:0 6px 16px rgba(38,45,41,.15);font-size:14px;font-weight:500;color:#29332f;display:grid;place-items:center;padding:0\">訪客</button><button class=\"line-image-btn\" data-action=\"line-login\" aria-label=\"LINE 登入\"></button></section></main>`}"
          new = "function renderHome(){return `<main class=\"home-screen\"><section class=\"home-panel home-login\"><button class=\"line-image-btn\" data-action=\"line-login\" aria-label=\"LINE 登入\"></button></section><button class=\"fight-hotspot\" data-action=\"guest-login\" aria-label=\"訪客進入遊戲\"></button></main>`}"

          if old not in text:
              raise SystemExit('Expected home source was not found; refusing to patch.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-guest-fight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js .github/workflows/patch-guest-fight.yml
          git commit -m "ui: use Fight as guest entry"
          git push
