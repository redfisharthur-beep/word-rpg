name: Patch result UI

on:
  push:
    paths:
      - '.github/workflows/patch-result-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update original result screen logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game.js')
          text = path.read_text(encoding='utf-8')

          old_wrong = "function wrongAnalysisHtml(){const wrong=run?.wrongAnswers||[];if(!wrong.length)return `<section class=\"wrong-analysis\"><h2>錯題分析</h2><p>本次全對</p></section>`;return `<section class=\"wrong-analysis\"><h2>錯題分析</h2>${wrong.map(x=>`<div class=\"wrong-item\"><b>${esc(x.word)}</b><span>正確：${esc(x.answer)}</span><small>你的答案：${esc(x.selected)}</small></div>`).join('')}</section>`}"
          new_wrong = "function wrongAnalysisHtml(){const wrong=run?.wrongAnswers||[];if(!wrong.length)return `<section class=\"wrong-analysis\"><h2>錯題分析</h2><p>本次全對</p></section>`;return `<section class=\"wrong-analysis\"><h2>錯題分析</h2>${wrong.map(x=>`<div class=\"wrong-item\"><b>${esc(x.word)}</b><span>${esc(x.answer)}</span></div>`).join('')}</section>`}"

          old_result = "function renderResult(win){return `<main class=\"result-screen\"><section class=\"result-card final-result-card\">${win?victoryImg():failImg()}${summaryHtml()}${win?rewardHtml():''}${wrongAnalysisHtml()}<button class=\"primary-btn\" data-action=\"retry\">重新開始</button><button class=\"secondary-btn\" data-action=\"home\">回首頁</button></section></main>`}"
          new_result = "function renderResult(win){return `<main class=\"result-screen\"><section class=\"result-card final-result-card\">${win?victoryImg():failImg()}${summaryHtml()}${win?rewardHtml():''}${wrongAnalysisHtml()}<div style=\"width:min(112px,28vw);margin:18px auto 0\">${imageButton(ASSETS.ui.back,'回首頁','data-action=\"home\"')}</div></section></main>`}"

          retry_binding = "document.querySelector('[data-action=\"retry\"]')?.addEventListener('click',startRun);"

          for old, new, label in [
              (old_wrong, new_wrong, 'wrong answer analysis'),
              (old_result, new_result, 'result actions'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected {label} source was not found; refusing to patch.')
              text = text.replace(old, new, 1)

          if retry_binding not in text:
              raise SystemExit('Expected retry binding was not found; refusing to patch.')
          text = text.replace(retry_binding, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-result-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js .github/workflows/patch-result-ui.yml
          git commit -m "ui: simplify result actions and wrong answer review"
          git push
