name: Crystal and pet enhancement
on:
  push:
    paths:
      - '.github/workflows/crystal-pet-upgrade.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        run: python3 .github/crystal-pet-upgrade.py
      - name: Verify syntax and rules
        run: |
          node --check src/rpg.js
          node --check src/cards.js
          node --check src/game.js
          grep -q "CRYSTAL_VALUE={common:1,rare:3,epic:8,legendary:20}" src/rpg.js
          grep -q "PET_ENHANCE_COST=\[5,10,20,40\]" src/rpg.js
          grep -q "petEnhance:{fox:0,owl:0,dragon:0}" src/rpg.js
          grep -q "petScale=1+petEnhance\*.10" src/cards.js
          grep -q "filter(item=>!equipped.has(item.id))" src/game.js
          grep -q "data-crystallize" src/game.js
          grep -q "data-pet-enhance" src/game.js
          grep -q "寵物能力 +" src/game.js
      - name: Smoke test RPG state
        run: |
          node --input-type=module <<'NODE'
          import {emptyRpg,cleanRpg,crystallizeItem,enhancePet,petEnhanceCost} from './src/rpg.js';
          const x=emptyRpg();
          if(x.crystals!==0||x.petEnhance.fox!==0) throw new Error('default rpg state');
          x.inventory=[{id:'a',type:'gem',subtype:'ruby',quality:'legendary'}];
          const y=crystallizeItem(x,'a');
          if(y.crystals!==20||y.inventory.length!==0) throw new Error('crystal conversion');
          y.crystals=75;
          let z=y;
          for(const cost of [5,10,20,40]){if(petEnhanceCost('fox',z)!==cost)throw new Error('cost ladder');z=enhancePet('fox',z)}
          if(z.petEnhance.fox!==4||z.crystals!==0||petEnhanceCost('fox',z)!==0) throw new Error('pet enhancement');
          NODE
      - name: Commit source and remove temporary files
        run: |
          git config user.name "redfisharthur-beep"
          git config user.email "redfisharthur@gmail.com"
          git rm .github/workflows/crystal-pet-upgrade.yml .github/crystal-pet-upgrade.py
          git add src/rpg.js src/cards.js src/game.js src/styles.css
          git commit -m "feat: add crystal recycling and pet enhancement"
          git push
