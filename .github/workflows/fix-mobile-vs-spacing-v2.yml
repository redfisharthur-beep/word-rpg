name: Fix mobile VS spacing v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-vs-spacing-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch original CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/styles.css')
          s=p.read_text()
          old='.combat-stage{grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:7px;min-height:340px;padding:10px 7px 116px}'
          new='.combat-stage{grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:9px;min-height:340px;padding:10px 7px 116px}'
          if s.count(old)!=1:
              raise SystemExit(f'expected one mobile combat-stage rule, found {s.count(old)}')
          s=s.replace(old,new)
          old2='.battle-center{margin-top:48px}.battle-center img{width:min(54px,100%)!important}'
          new2='.battle-center{margin-top:24px}.battle-center img{width:min(52px,100%)!important}.fighter.hero{padding-right:4px}.fighter.enemy{padding-left:4px}'
          if s.count(old2)!=1:
              raise SystemExit(f'expected one mobile battle-center rule, found {s.count(old2)}')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -Fq 'grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:9px' src/styles.css
          grep -Fq '.battle-center{margin-top:24px}.battle-center img{width:min(52px,100%)!important}' src/styles.css
          grep -Fq '.fighter.hero{padding-right:4px}.fighter.enemy{padding-left:4px}' src/styles.css
          node --check src/game.js
          node --check src/pk.js
      - name: Commit source and remove workflows
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git add src/styles.css
          git commit -m 'fix: separate VS from mobile fighters'
          git push
          git rm -f .github/workflows/fix-mobile-vs-spacing-v2.yml .github/workflows/fix-mobile-vs-spacing.yml
          git commit -m 'chore: remove completed VS fix workflows'
          git push