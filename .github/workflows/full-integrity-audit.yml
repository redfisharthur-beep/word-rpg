name: Full integrity audit
on:
  push:
    paths:
      - '.github/workflows/full-integrity-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and integrity tests
        shell: bash
        run: |
          set +e
          for f in src/*.js worker/index.js; do node --check "$f" || exit 1; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {ASSETS} from './src/assets.js';
          import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,equipmentBonuses,crystalValue,crystallizeItem,petEnhanceCost,enhancePet,petEnhanceLevel,canUnlockPetSkill,unlockPetSkill,availableSkillPoints,PET_TREES} from './src/rpg.js';
          import {progressionStats,dealHand,makeFighter,accuracyMultiplier,resolveCardAction,afterAction,effectiveDef} from './src/cards.js';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const finiteF=f=>['hp','maxHp','atk','def','crit','shield'].every(k=>Number.isFinite(Number(f[k])));
          function seq(vals){let i=0;return ()=>vals[Math.min(i++,vals.length-1)]}
          function loot(q,type,sub=.1){const x=rollLoot(3,50,seq([0,q,type,sub]));assert(x,'loot generation failed');return x}
          // Asset coverage: declared assets, 15 exclusive skills, 24 loot images and CSS image urls.
          const paths=[]; const walk=o=>Object.values(o).forEach(v=>typeof v==='string'?paths.push(v):walk(v)); walk(ASSETS);
          for(const role of ['warrior','mage','archer'])for(const lv of [10,20,30,40,50])paths.push(`/images/skill-${role}-${lv}.png`);
          for(const type of ['gem','armor','ring']){
            const subs=type==='gem'?['ruby','thunder']:type==='armor'?['guardian','bloodspirit']:['warbreaker','battlesoul'];
            for(const sub of subs)for(const q of ['common','rare','epic','legendary'])paths.push(`/images/loot-${type}-${sub}-${q}.png`);
          }
          const css=fs.readFileSync('src/styles.css','utf8'); for(const m of css.matchAll(/url\(['\"]?(\/images\/[^)'\"]+)/g))paths.push(m[1]);
          for(const p of new Set(paths)){const disk='.'+decodeURIComponent(p);assert(fs.existsSync(disk),`missing asset ${p}`)}
          // Loot quality/type mapping.
          assert(loot(.10,.10,.10).name.includes('普通紅曜石'),'common ruby map');
          assert(loot(.50,.10,.90).name.includes('稀有雷光石'),'rare thunder map');
          assert(loot(.85,.70,.10).name.includes('史詩守護甲'),'epic guardian map');
          assert(loot(.97,.70,.90).name.includes('傳說血靈甲'),'legendary bloodspirit map');
          assert(loot(.97,.90,.10).name.includes('傳說破軍戒'),'legendary warbreaker map');
          assert(loot(.97,.90,.90).name.includes('傳說戰魂戒'),'legendary battlesoul map');
          // Slot rules: 3 gems, 1 armor, 2 rings.
          let r=emptyRpg(); const gems=[loot(.1,.1,.1),loot(.5,.1,.1),loot(.85,.1,.9),loot(.97,.1,.9)],armor=[loot(.1,.7,.1),loot(.97,.7,.9)],rings=[loot(.1,.9,.1),loot(.5,.9,.9),loot(.97,.9,.1)];
          for(const x of [...gems,...armor,...rings])r=addLoot(r,x);
          for(const x of gems)r=equipItem(r,x.id); assert(r.equipped.gems.length===3,'gem slot limit');
          r=equipItem(r,armor[0].id);r=equipItem(r,armor[1].id);assert(r.equipped.armor===armor[1].id,'armor replacement');
          for(const x of rings)r=equipItem(r,x.id);assert(r.equipped.rings.length===2,'ring slot limit');
          const eq=equipmentBonuses(r);assert(Object.values(eq).every(Number.isFinite),'equipment bonus finite');
          const equippedId=r.equipped.gems[0],beforeCrystal=r.crystals;r=crystallizeItem(r,equippedId);assert(r.crystals===beforeCrystal&&r.inventory.some(x=>x.id===equippedId),'equipped crystallize guard');
          // Inventory cap must never delete an equipped item.
          let cap=emptyRpg();const anchor=loot(.97,.1,.1);cap=addLoot(cap,anchor);cap=equipItem(cap,anchor.id);
          for(let i=0;i<65;i++)cap=addLoot(cap,loot(.1,.9,i%2?.9:.1));
          assert(cap.inventory.length<=60,'inventory cap');
          assert(cap.inventory.some(x=>x.id===anchor.id)&&cap.equipped.gems.includes(anchor.id),'inventory cap deleted equipped gear');
          // Crystal values and 4-step pet enhancement costs 5/10/20/40.
          assert(crystalValue({quality:'common'})===1&&crystalValue({quality:'rare'})===3&&crystalValue({quality:'epic'})===8&&crystalValue({quality:'legendary'})===20,'crystal values');
          let pe=emptyRpg();pe.crystals=75;for(const cost of [5,10,20,40]){assert(petEnhanceCost('fox',pe)===cost,`pet enhance cost ${cost}`);pe=enhancePet('fox',pe)}assert(petEnhanceLevel('fox',pe)===4&&pe.crystals===0&&petEnhanceCost('fox',pe)===0,'pet enhancement max');
          const p0=progressionStats('warrior','fox',50,emptyRpg()).total,p4=progressionStats('warrior','fox',50,{...emptyRpg(),petEnhance:{fox:4,owl:0,dragon:0}}).total;assert(p4.maxHp>p0.maxHp&&p4.atk>p0.atk&&p4.def>p0.def,'pet enhancement not affecting stats');
          // Skill tree ordering and shared point budget.
          let sk=emptyRpg();assert(!canUnlockPetSkill('fox','fox-2',50,sk),'skill prerequisite bypass');for(const n of PET_TREES.fox){assert(canUnlockPetSkill('fox',n.id,50,sk),`cannot unlock ${n.id}`);sk=unlockPetSkill('fox',n.id,50,sk)}assert(availableSkillPoints(50,sk)===19,'skill shared budget after full fox');
          // Exclusive hand counts and answer multipliers.
          for(const [lv,count] of [[1,0],[9,0],[10,1],[29,1],[30,2],[49,2],[50,3]]){for(let i=0;i<30;i++){const h=dealHand(9,'warrior',lv);assert(h.length===9,`hand size ${lv}`);assert(h.filter(x=>x.exclusive).length===count,`exclusive count ${lv}`)}}
          assert(accuracyMultiplier(0)===0&&accuracyMultiplier(1)===.65&&accuracyMultiplier(2)===1.15&&accuracyMultiplier(3)===1.5,'accuracy multipliers');
          // Exact 2-turn fresh duration semantics.
          let a=makeFighter({def:100,defBoost:[{pct:2,turns:2,fresh:true}],crit:0}),b=makeFighter({crit:0});afterAction(a,b,[]);assert(a.defBoost[0]?.turns===2&&!a.defBoost[0]?.fresh,'fresh duration decremented too early');afterAction(a,b,[]);assert(a.defBoost[0]?.turns===1,'duration first subsequent action');afterAction(a,b,[]);assert(a.defBoost.length===0,'duration did not expire');
          // Random combat stress: no NaN/negative resource corruption.
          for(const role of ['warrior','mage','archer'])for(const pet of ['fox','owl','dragon'])for(const lv of [1,10,30,50])for(let sim=0;sim<40;sim++){
            const st=progressionStats(role,pet,lv,emptyRpg()).total,hero=makeFighter({...st,role,pet,rpg:emptyRpg(),crit:0}),enemy=makeFighter({maxHp:1800,hp:1800,atk:220,def:120,crit:0}),h=dealHand(9,role,lv);
            for(let i=0;i<9&&hero.hp>0&&enemy.hp>0;i++){resolveCardAction(hero,enemy,h[i],i%4,{cards:h.slice(0,3),slotIndex:i%3,speedWin:i%2===0});afterAction(hero,enemy,[]);assert(finiteF(hero)&&finiteF(enemy),'non-finite fighter state');assert(hero.hp>=0&&enemy.hp>=0&&hero.shield>=0&&enemy.shield>=0,'negative hp/shield')}
          }
          console.log('AUDIT_OK');
          NODE
          code=$?
          echo "$code" > /tmp/audit-exit
          exit 0
      - name: Remove audit workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git rm .github/workflows/full-integrity-audit.yml
          git commit -m 'chore: remove completed integrity audit workflow'
          git push
      - name: Report audit result
        if: always()
        shell: bash
        run: |
          test "$(cat /tmp/audit-exit 2>/dev/null || echo 1)" -eq 0
