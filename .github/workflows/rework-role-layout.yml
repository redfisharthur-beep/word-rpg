name: Rework role layout
on:
  push:
    paths:
      - '.github/workflows/rework-role-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rework original source layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          game = Path('src/game.js')
          s = game.read_text()
          old = "function growthPanel(stats,kind='role'){const guest=meta.authMode==='guest',statHtml=`${growthItem(ASSETS.ui.hp,stats.maxHp,'生命')}${growthItem(ASSETS.ui.atk,stats.atk,'攻擊')}${growthItem(ASSETS.ui.def,stats.def,'防禦')}`;if(kind==='pet')return `<div class=\"growth-panel pet-growth-panel\"><div class=\"growth-stats\">${statHtml}</div></div>`;const tier=titleTier(guest?1:meta.level),r=ROLES[meta.role]||ROLES.warrior,levelText=guest?'Lv.1':meta.level>=50?'Lv.50 · 滿級':`Lv.${meta.level}`,name=meta.authMode==='line'&&meta.playerName?`<span class=\"growth-player-name\">${esc(meta.playerName)}</span>`:'';return `<div class=\"growth-panel role-growth-panel\"><div class=\"growth-level\"><span class=\"growth-role-name\">${esc(r.name)}</span><b>${levelText}</b><span>${guest?'訪客':esc(tier.name)}</span>${name}</div><div class=\"growth-stats\">${statHtml}</div></div>`}"
          new = "function growthPanel(stats,kind='role'){const guest=meta.authMode==='guest',statHtml=`${growthItem(ASSETS.ui.hp,stats.maxHp,'生命')}${growthItem(ASSETS.ui.atk,stats.atk,'攻擊')}${growthItem(ASSETS.ui.def,stats.def,'防禦')}`;if(kind==='pet')return `<div class=\"growth-panel pet-growth-panel\"><div class=\"growth-stats\">${statHtml}</div></div>`;const tier=titleTier(guest?1:meta.level),levelText=guest?'Lv.1':meta.level>=50?'Lv.50 · 滿級':`Lv.${meta.level}`,playerName=meta.playerName||'訪客';return `<div class=\"growth-panel role-growth-panel\"><div class=\"growth-level\"><span class=\"growth-player-name\">${esc(playerName)}</span><b>${levelText}</b><span class=\"growth-title\">${esc(tier.name)}</span></div><div class=\"growth-stats\">${statHtml}</div></div>`}"
          if old not in s:
              raise SystemExit('growthPanel target not found')
          s = s.replace(old, new)
          game.write_text(s)

          css = Path('src/styles.css')
          c = css.read_text()
          replacements = [
            (r"\.role-feature\{min-height:\d+px;padding:[^}]+\}", ".role-feature{position:relative;min-height:420px;padding:76px 18px 18px}"),
            (r"\.role-growth-art\{[^}]*\}", ".role-growth-art{padding:0 8px 0 4px;overflow:visible}"),
            (r"\.role-growth-art img\{[^}]*\}", ".role-growth-art img{height:365px;width:100%;max-width:100%;transform:translateX(3%) scale(1.06);transform-origin:center center}"),
            (r"\.role-feature \.growth-panel\{[^}]*\}", ".role-feature .growth-panel{transform:none}"),
            (r"\.growth-role-name\{[^}]*\}", ".growth-role-name{display:none}"),
          ]
          for pat, rep in replacements:
              c, n = re.subn(pat, rep, c, count=1)
              if n != 1:
                  raise SystemExit(f'css target not found: {pat}')

          anchor = ".pet-growth-panel{align-content:center;transform:translateX(14px)}"
          inject = ".pet-growth-panel{align-content:center;transform:translateX(14px)}.role-feature.growth-feature{grid-template-columns:minmax(0,1.5fr) minmax(170px,.5fr)}.role-feature .growth-level{position:absolute;top:18px;left:18px;right:18px;display:flex;align-items:baseline;justify-content:center;gap:14px;white-space:nowrap;z-index:3}.role-feature .growth-player-name{font-size:20px!important;color:#29332f!important}.role-feature .growth-level b{font-size:29px}.role-feature .growth-title{font-size:18px!important}.role-growth-panel{align-content:center}.role-growth-panel .growth-stats{justify-self:start}"
          if anchor not in c:
              raise SystemExit('desktop anchor not found')
          c = c.replace(anchor, inject, 1)

          media = '@media(max-width:700px){'
          if media not in c:
              raise SystemExit('mobile media not found')
          before, mobile = c.split(media, 1)
          mobile = re.sub(r"\.role-feature\{min-height:\d+px;padding:[^}]+\}", ".role-feature{min-height:350px;padding:64px 6px 10px 10px}", mobile, count=1)
          mobile = re.sub(r"\.role-growth-art img\{[^}]*\}", ".role-growth-art img{height:305px;width:100%;max-width:100%;transform:translateX(4%) scale(1.08);transform-origin:center center}", mobile, count=1)
          mobile = re.sub(r"\.role-feature \.growth-panel\{[^}]*\}", ".role-feature .growth-panel{transform:none}", mobile, count=1)
          m_anchor = ".pet-growth-art img{height:112px;width:min(100%,155px);transform:translateX(0)}"
          m_inject = ".pet-growth-art img{height:112px;width:min(100%,155px);transform:translateX(0)}.role-feature.growth-feature{grid-template-columns:minmax(0,1.5fr) minmax(108px,.5fr)}.role-feature .growth-level{top:10px;left:8px;right:8px;gap:7px;justify-content:center}.role-feature .growth-player-name{font-size:14px!important}.role-feature .growth-level b{font-size:20px}.role-feature .growth-title{font-size:14px!important}.role-growth-panel .growth-stats{justify-self:start}"
          if m_anchor not in mobile:
              raise SystemExit('mobile anchor not found')
          mobile = mobile.replace(m_anchor, m_inject, 1)
          c = before + media + mobile
          css.write_text(c)
          PY
      - name: Syntax check
        run: node --check src/game.js
      - name: Commit original source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rework-role-layout.yml
          git add src/game.js src/styles.css
          git commit -m "ui: enlarge role art and move player info above"
          git push
