name: Patch progression system

on:
  push:
    paths:
      - '.github/workflows/patch-progression-system.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply progression patch
        run: python .github/scripts/patch_progression.py
      - name: Syntax check
        run: |
          node --check src/cards.js
          node --check src/game.js
          node --check src/pk.js
          node --check worker/index.js
      - name: Commit source update and remove temporary patch files
        run: |
          rm .github/workflows/patch-progression-system.yml
          rm .github/scripts/patch_progression.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cards.js src/game.js src/pk.js src/styles.css worker/index.js .github/workflows/patch-progression-system.yml .github/scripts/patch_progression.py
          git commit -m "feat: implement title bonuses and role skill cards"
          git push
