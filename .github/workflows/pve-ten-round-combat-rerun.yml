name: Rerun PvE ten-round combat update
on:
  push:
    paths:
      - '.github/workflows/pve-ten-round-combat-rerun.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pve-ten-round-combat.yml').read_text()
          anchor=src.index('      - name: Patch game source')
          marker='        run: |\n'
          start=src.index(marker,anchor)+len(marker)
          end=src.index('      - name: Verify',start)
          block=src[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script='\n'.join(lines)+'\n'
          script=script.replace("if count!=4: raise SystemExit(f'round<=3 expected 4 matches, got {count}')","if count!=5: raise SystemExit(f'round<=3 expected 5 matches, got {count}')")
          Path('/tmp/pve-patch.sh').write_text(script)
          PY
          bash /tmp/pve-patch.sh
      - name: Verify
        shell: bash
        run: |
          set -e
          for f in src/*.js worker/index.js; do node --check "$f"; done
          npm test
          grep -Fq "for(let autoRound=3;autoRound<=10" src/game.js
          grep -Fq "if(run.round>=2)return startAutoDuel()" src/game.js
          grep -Fq "function autoActionVisual" src/game.js
          grep -Fq "screen==='draw'?renderResult('draw')" src/game.js
          grep -Fq "run.player.healBlock=[];run.player.stun=0" src/game.js
          ! grep -Fq "run.round<=3" src/game.js
          ! grep -Fq "run.round>=3" src/game.js
      - name: Commit source
        shell: bash
        run: |
          git config user.name "openai-workflow"
          git config user.email "actions@users.noreply.github.com"
          git add src/game.js
          git diff --cached --quiet && exit 1
          git commit -m "feat: align PvE and tower with ten-round combat"
          git push origin HEAD:main
