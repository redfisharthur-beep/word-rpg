name: RPG progression systems
on:
  push:
    paths:
      - '.github/workflows/rpg-progression-systems.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, found {n}')
              return text.replace(old,new,1)

          # cards.js
          p=Path('src/cards.js'); s=p.read_text()
          s=once(s,"export const COLORS={green:'綠色',blue:'藍色',red:'紅色',yellow:'黃色',neutral:'輔助'};", "import {equipmentBonuses,petSkillEffects} from './rpg.js';\n\nexport const COLORS={green:'綠色',blue:'藍色',red:'紅色',yellow:'黃色',neutral:'輔助'};",'cards import')
          s=once(s,"export const BASE={maxHp:500,hp:500,atk:100,def:50,crit:.10,shield:0,poison:[],armorBreak:[],atkDown:[],critLock:0,defBoost:[],regen:false,role:'warrior',pet:null,monsterId:null};", "export const BASE={maxHp:500,hp:500,atk:100,def:50,crit:.10,shield:0,poison:[],armorBreak:[],atkDown:[],critLock:0,defBoost:[],regen:0,role:'warrior',pet:null,monsterId:null,rpg:null};",'base regen')
          old="""export function progressionStats(role='warrior',pet='fox',level=1){
  const lv=clamp(Math.round(Number(level)||1),1,50),rb=ROLE_BASE[role]||ROLE_BASE.warrior,pb=PET_BASE[pet]||PET_BASE.fox,tier=titleTier(lv);
  const rawRole={maxHp:rb.hp*(1+(lv-1)*.035),atk:rb.atk*(1+(lv-1)*.025),def:rb.def*(1+(lv-1)*.025)};
  const roleStats={maxHp:Math.round(rawRole.maxHp*(1+tier.hp)),atk:Math.round(rawRole.atk*(1+tier.atk)),def:Math.round(rawRole.def*(1+tier.def))};
  const petStats={maxHp:Math.round(pb.hp*(1+(lv-1)*.03)),atk:Math.round(pb.atk*(1+(lv-1)*.03)),def:Math.round(pb.def*(1+(lv-1)*.03))};
  const total={maxHp:roleStats.maxHp+petStats.maxHp,atk:roleStats.atk+petStats.atk,def:roleStats.def+petStats.def,crit:.10+tier.crit};
  return {level:lv,role:roleStats,pet:petStats,title:tier,total:{...total,hp:total.maxHp}};
}"""
          new="""export function progressionStats(role='warrior',pet='fox',level=1,rpg=null){
  const lv=clamp(Math.round(Number(level)||1),1,50),rb=ROLE_BASE[role]||ROLE_BASE.warrior,pb=PET_BASE[pet]||PET_BASE.fox,tier=titleTier(lv),eq=equipmentBonuses(rpg||{}),petFx=petSkillEffects(pet,rpg||{});
  const rawRole={maxHp:rb.hp*(1+(lv-1)*.035),atk:rb.atk*(1+(lv-1)*.025),def:rb.def*(1+(lv-1)*.025)};
  const roleStats={maxHp:Math.round(rawRole.maxHp*(1+tier.hp)),atk:Math.round(rawRole.atk*(1+tier.atk)),def:Math.round(rawRole.def*(1+tier.def))};
  const petStats={maxHp:Math.round(pb.hp*(1+(lv-1)*.03)),atk:Math.round(pb.atk*(1+(lv-1)*.03)),def:Math.round(pb.def*(1+(lv-1)*.03))};
  const total={maxHp:Math.round((roleStats.maxHp+petStats.maxHp)*(1+eq.hpPct+petFx.hpPct)),atk:Math.round((roleStats.atk+petStats.atk)*(1+eq.atkPct+petFx.atkPct)),def:Math.round((roleStats.def+petStats.def)*(1+eq.defPct+petFx.defPct)),crit:Math.min(.85,.10+tier.crit+eq.crit+petFx.crit)};
  return {level:lv,role:roleStats,pet:petStats,title:tier,total:{...total,hp:total.maxHp}};
}"""
          s=once(s,old,new,'progressionStats')
          s=once(s,"export function accuracyMultiplier(correct,actor=null){if(correct===3)return 1.5;if(correct===2)return 1;if(correct===1)return .5;if(actor?.pet==='owl')return .25;return 0;}", "export function accuracyMultiplier(correct,actor=null){if(correct===3)return 1.5;if(correct===2)return 1.15;if(correct===1)return .65;if(actor?.pet==='owl'){const fx=petSkillEffects(actor.pet,actor.rpg||{});return .25+fx.zeroAccuracy}return 0;}",'accuracy')
          old="""export function afterAction(actor,other,logs=[]){
  if(actor.regen&&actor.hp>0){const v=Math.round(effectiveAtk(actor)*.30);heal(actor,v,logs,'生生不息');}
  if((actor.poison||[]).length&&actor.hp>0){let total=0;for(const p of actor.poison){total+=p.damage;p.turns--;}actor.hp=Math.max(0,actor.hp-total);logs.push(`毒素 ${total}`);}
  for(const k of ['armorBreak','atkDown','defBoost'])for(const s of actor[k]||[])s.turns--;
  if(actor.critLock>0)actor.critLock--;
  cleanDurations(actor);cleanDurations(other);return logs;
}"""
          new="""export function afterAction(actor,other,logs=[]){
  if(Number(actor.regen)>0&&actor.hp>0){const v=Math.round(effectiveAtk(actor)*.30);heal(actor,v,logs,'生生不息');actor.regen=Math.max(0,Number(actor.regen)-1);}
  if((actor.poison||[]).length&&actor.hp>0){let total=0;for(const p of actor.poison){total+=p.damage;p.turns--;}actor.hp=Math.max(0,actor.hp-total);logs.push(`毒素 ${total}`);}
  for(const k of ['armorBreak','atkDown','defBoost'])for(const s of actor[k]||[])s.turns--;
  if(actor.critLock>0)actor.critLock--;
  cleanDurations(actor);cleanDurations(other);return logs;
}"""
          s=once(s,old,new,'afterAction')
          s=once(s,"case'desperate':hit(actor,target,2*power,logs,'破釜沉舟');actor.def*=.5;logs.push('自身防禦 -50%');break;", "case'desperate':hit(actor,target,2*power,logs,'破釜沉舟');actor.defBoost.push({pct:-.5,turns:2});logs.push('自身防禦 -50%・2回合');break;",'desperate')
          s=once(s,"const now=Math.max(1,Math.round(actor.maxHp*.15*power));healHpOnly(actor,now,logs,'生生不息');actor.regen=true;logs.push('持續回血啟動');break;", "const now=Math.max(1,Math.round(actor.maxHp*.15*power));healHpOnly(actor,now,logs,'生生不息');actor.regen=3;logs.push('持續回血 3回合');break;",'regen')
          s=once(s,"const logs=[],acc=accuracyMultiplier(correct,actor);", "const logs=[],acc=accuracyMultiplier(correct,actor),petFx=petSkillEffects(actor?.pet,actor?.rpg||{});",'pet effects resolve')
          old="""  if(actor.pet==='fox'&&speedWin&&slotIndex===0){petAmp*=1.20;logs.push('靈狐先機 +20%');}
  if(actor.pet==='dragon'&&card.color==='yellow'){petAmp*=1.20;logs.push('幼龍黃牌共鳴 +20%');}
  const yellowCount=cards.filter(x=>x?.color==='yellow').length;
  if(actor.pet==='dragon'&&yellowCount>=2&&slotIndex===cards.length-1){petAmp*=1.30;logs.push('幼龍終式爆發 +30%');}"""
          new="""  if(actor.pet==='fox'&&speedWin&&slotIndex===0){const amp=.20+petFx.firstCardAmp;petAmp*=1+amp;logs.push(`靈狐先機 +${Math.round(amp*100)}%`);}
  if(actor.pet==='fox'&&card.color==='red'&&petFx.redAmp>0)petAmp*=1+petFx.redAmp;
  if(actor.pet==='owl'&&(card.color==='green'||card.color==='blue')&&petFx.stableAmp>0)petAmp*=1+petFx.stableAmp;
  if(actor.pet==='dragon'&&card.color==='yellow'){const amp=.20+petFx.yellowAmp;petAmp*=1+amp;logs.push(`幼龍黃牌共鳴 +${Math.round(amp*100)}%`);}
  const yellowCount=cards.filter(x=>x?.color==='yellow').length;
  if(actor.pet==='dragon'&&yellowCount>=2&&slotIndex===cards.length-1){const amp=.30+petFx.finisherAmp;petAmp*=1+amp;logs.push(`幼龍終式爆發 +${Math.round(amp*100)}%`);}"""
          s=once(s,old,new,'pet multipliers')
          s=once(s,"if(actor.role==='warrior'&&card.color==='blue'&&actor.hp>0){const v=Math.max(1,Math.round(effectiveDef(actor)*.20));actor.shield+=v;logs.push(`戰士護盾 +${v}`);}", "if(actor.role==='warrior'&&card.color==='blue'&&actor.hp>0){const v=Math.max(1,Math.round(effectiveDef(actor)*.14));actor.shield+=v;logs.push(`戰士護盾 +${v}`);}",'warrior shield')
          s=once(s,"if(actor.pet==='fox'&&redCount>=2&&slotIndex===cards.length-1&&target.hp>0){hit(actor,target,.40*acc,logs,'靈狐追擊');}", "if(actor.pet==='fox'&&redCount>=2&&slotIndex===cards.length-1&&target.hp>0){hit(actor,target,(.40+petFx.chaseAmp)*acc,logs,'靈狐追擊');}",'fox chase')
          s=once(s,"export function applyPetRoundEnd(actor,cards=[],logs=[]){\n  if(actor?.pet==='owl'&&actor.hp>0){const stable=cards.filter(c=>c?.color==='green'||c?.color==='blue').length;if(stable>=2)healHpOnly(actor,Math.round(actor.maxHp*.08),logs,'夜梟守心');}\n  return logs;\n}", "export function applyPetRoundEnd(actor,cards=[],logs=[]){\n  if(actor?.pet==='owl'&&actor.hp>0){const stable=cards.filter(c=>c?.color==='green'||c?.color==='blue').length,fx=petSkillEffects(actor.pet,actor.rpg||{});if(stable>=2)healHpOnly(actor,Math.round(actor.maxHp*(.08+fx.guardHeal)),logs,'夜梟守心');}\n  return logs;\n}",'owl round end')
          p.write_text(s)

          # game.js
          p=Path('src/game.js'); s=p.read_text()
          s=once(s,"import {setMusic} from './audio.js';", "import {setMusic} from './audio.js';\nimport {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,itemBonusText,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills} from './rpg.js';",'game rpg import')
          old="function loadMeta(){const base={playerName:'',role:'warrior',pet:'fox',level:1,xp:0,authMode:'none',lineUserId:'',linePicture:''};try{const x={...base,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')};x.level=Math.max(1,Math.min(50,Math.round(Number(x.level)||1)));x.xp=x.level>=50?0:Math.max(0,Math.round(Number(x.xp)||0));return x}catch{return base}}"
          new="function loadMeta(){const base={playerName:'',role:'warrior',pet:'fox',level:1,xp:0,authMode:'none',lineUserId:'',linePicture:'',rpg:emptyRpg()};try{const x={...base,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')};x.level=Math.max(1,Math.min(50,Math.round(Number(x.level)||1)));x.xp=x.level>=50?0:Math.max(0,Math.round(Number(x.xp)||0));x.rpg=cleanRpg(x.rpg);return x}catch{return base}}"
          s=once(s,old,new,'loadMeta')
          s=once(s,"body:JSON.stringify({role:meta.role,pet:meta.pet,level:meta.level,xp:meta.xp})", "body:JSON.stringify({role:meta.role,pet:meta.pet,level:meta.level,xp:meta.xp,rpg:meta.rpg})",'sync rpg')
          old="meta={...meta,authMode:'line',lineUserId:profile.userId||'',linePicture:profile.picture||'',playerName:String(profile.name||'LINE 玩家').slice(0,16),role:['warrior','mage','archer'].includes(p.role)?p.role:meta.role,pet:['fox','owl','dragon'].includes(p.pet)?p.pet:meta.pet,level:Math.max(1,Math.min(50,Math.round(Number(p.level)||1))),xp:Math.max(0,Math.round(Number(p.xp)||0))};"
          new="meta={...meta,authMode:'line',lineUserId:profile.userId||'',linePicture:profile.picture||'',playerName:String(profile.name||'LINE 玩家').slice(0,16),role:['warrior','mage','archer'].includes(p.role)?p.role:meta.role,pet:['fox','owl','dragon'].includes(p.pet)?p.pet:meta.pet,level:Math.max(1,Math.min(50,Math.round(Number(p.level)||1))),xp:Math.max(0,Math.round(Number(p.xp)||0)),rpg:cleanRpg(p.rpg)};"
          s=once(s,old,new,'apply line rpg')
          s=once(s,"meta={...meta,authMode:'guest',lineUserId:'',linePicture:'',playerName:'訪客',level:1,xp:0};", "meta={...meta,authMode:'guest',lineUserId:'',linePicture:'',playerName:'訪客',level:1,xp:0,rpg:emptyRpg()};",'guest rpg')
          s=once(s,"function growth(){return progressionStats(meta.role,meta.pet,meta.authMode==='guest'?1:meta.level)}", "function growth(){return progressionStats(meta.role,meta.pet,meta.authMode==='guest'?1:meta.level,meta.rpg)}",'growth equipment')
          s=once(s,"const level=meta.authMode==='guest'?1:meta.level,p=progressionStats(meta.role,meta.pet,level).total;", "const level=meta.authMode==='guest'?1:meta.level,p=progressionStats(meta.role,meta.pet,level,meta.rpg).total;",'run equipment stats')
          s=once(s,"player:makeFighter({...p,role:meta.role,pet:meta.pet})", "player:makeFighter({...p,role:meta.role,pet:meta.pet,rpg:meta.rpg})",'fighter rpg')
          s=once(s,"stageRewarded:false,lastReward:null};beginStage()", "stageRewarded:false,lastReward:null,lastLoot:null};beginStage()",'run last loot')
          s=once(s,"run.stageRewarded=false;run.lastReward=null;screen='cards';render()", "run.stageRewarded=false;run.lastReward=null;run.lastLoot=null;screen='cards';render()",'stage loot reset')

          marker="function statItem(src,value,label){"
          insert="""function equipmentSlot(label,id){const item=meta.rpg.inventory.find(x=>x.id===id);return `<div class="equip-slot"><b>${esc(label)}</b>${item?`<span class="quality-${esc(item.quality)}">${esc(item.name)}</span><small>${esc(itemBonusText(item))}</small><button class="mini-system-btn" data-unequip="${esc(item.id)}">卸下</button>`:'<span>—</span>'}</div>`}
function renderEquipment(){const eq=meta.rpg.equipped,equipped=new Set([...eq.gems,eq.armor,eq.ring].filter(Boolean)),items=[...meta.rpg.inventory].reverse();return `<main class="setup-screen system-screen"><section class="system-card"><div class="system-head"><button class="text-btn" data-action="setup-back">返回</button><h1>裝備</h1><span></span></div><div class="equip-grid">${[0,1,2].map(i=>equipmentSlot(`寶石 ${i+1}`,eq.gems[i])).join('')}${equipmentSlot('裝甲',eq.armor)}${equipmentSlot('戒指',eq.ring)}</div><div class="inventory-list">${items.length?items.map(item=>{const on=equipped.has(item.id),gemFull=item.type==='gem'&&eq.gems.length>=3&&!on;return `<div class="loot-item quality-border-${esc(item.quality)}"><div><b class="quality-${esc(item.quality)}">${esc(item.name)}</b><small>${esc(itemBonusText(item))}</small></div><button class="mini-system-btn" ${on?'data-unequip':'data-equip'}="${esc(item.id)}" ${gemFull?'disabled':''}>${on?'卸下':'裝備'}</button></div>`}).join(''):'<div class="empty-system">尚未獲得裝備</div>'}</div></section></main>`}
function renderPetTree(){const points=availableSkillPoints(meta.level,meta.rpg);return `<main class="setup-screen system-screen"><section class="system-card"><div class="system-head"><button class="text-btn" data-action="setup-back">返回</button><h1>寵物技能</h1><b>${points} 點</b></div><div class="pet-tree-grid">${Object.entries(PET_TREES).map(([pet,tree])=>{const owned=new Set(meta.rpg.petSkills[pet]||[]);return `<section class="pet-tree"><h2>${esc(PETS[pet]?.name||pet)}</h2>${tree.map((node,i)=>{const got=owned.has(node.id),ok=canUnlockPetSkill(pet,node.id,meta.level,meta.rpg);return `<button class="skill-node ${got?'unlocked':''}" data-pet-skill="${pet}|${node.id}" ${got||!ok?'disabled':''}><b>${i+1}. ${esc(node.name)}</b><span>${node.cost} 點</span><small>${esc(node.desc)}</small></button>`}).join('')}</section>`}).join('')}</div><button class="secondary-btn reset-tree-btn" data-action="reset-pet-tree">重置技能樹</button></section></main>`}
"""
          s=once(s,marker,insert+marker,'system screens')

          old="""function renderSetup(){const r=ROLES[meta.role]||ROLES.warrior,p=PETS[meta.pet]||PETS.fox,g=growth();return `<main class="setup-screen"><section class="setup-card"><section class="choice-section"><div class="choice-feature role-feature theme-${esc(meta.role)} growth-feature"><div class="growth-art role-growth-art">${uiImg(r.art,r.name,'')}</div>${growthPanel(g.role,'role')}</div><div class="choice-tabs">${Object.entries(ROLES).map(([id,x])=>`<button class="choice-tab ${meta.role===id?'active':''}" data-role="${id}">${esc(x.name)}</button>`).join('')}</div></section><section class="choice-section pet-section"><div class="choice-feature pet-feature theme-${esc(meta.pet)} growth-feature"><div class="growth-art pet-growth-art">${uiImg(p.art,p.name,'')}</div>${growthPanel(g.pet,'pet')}</div><div class="choice-tabs">${Object.entries(PETS).map(([id,x])=>`<button class="choice-tab ${meta.pet===id?'active':''}" data-pet="${id}">${esc(x.name)}</button>`).join('')}</div></section><div class="setup-actions">${imageButton(ASSETS.ui.fight,'開始冒險','data-action="start"')}${imageButton(ASSETS.ui.pk,'線上對戰','data-action="pk"')}</div></section></main>`}"""
          new="""function renderSetup(){const r=ROLES[meta.role]||ROLES.warrior,p=PETS[meta.pet]||PETS.fox,g=growth();return `<main class="setup-screen"><section class="setup-card"><section class="choice-section"><div class="choice-feature role-feature theme-${esc(meta.role)} growth-feature"><div class="growth-art role-growth-art">${uiImg(r.art,r.name,'')}</div>${growthPanel(g.role,'role')}</div><div class="choice-tabs">${Object.entries(ROLES).map(([id,x])=>`<button class="choice-tab ${meta.role===id?'active':''}" data-role="${id}">${esc(x.name)}</button>`).join('')}</div><button class="system-entry equipment-entry" data-action="equipment">裝備</button></section><section class="choice-section pet-section"><div class="choice-feature pet-feature theme-${esc(meta.pet)} growth-feature"><div class="growth-art pet-growth-art">${uiImg(p.art,p.name,'')}</div>${growthPanel(g.pet,'pet')}</div><div class="choice-tabs">${Object.entries(PETS).map(([id,x])=>`<button class="choice-tab ${meta.pet===id?'active':''}" data-pet="${id}">${esc(x.name)}</button>`).join('')}</div><button class="system-entry pet-tree-entry" data-action="pet-tree">寵物技能</button></section><div class="setup-actions">${imageButton(ASSETS.ui.fight,'開始冒險','data-action="start"')}${imageButton(ASSETS.ui.pk,'線上對戰','data-action="pk"')}</div></section></main>`}"""
          s=once(s,old,new,'setup buttons')

          s=once(s,"function rewardStage(){if(run.stageRewarded)return run.lastReward;run.stageRewarded=true;run.lastReward=addXp(80+run.stageIndex*25);return run.lastReward}", "function rewardStage(){if(run.stageRewarded)return run.lastReward;run.stageRewarded=true;run.lastReward=addXp(80+run.stageIndex*25);run.lastLoot=null;if(meta.authMode!=='guest'){const item=rollLoot(run.stageIndex,run.level);if(item){meta.rpg=addLoot(meta.rpg,item);run.lastLoot=item;saveMeta()}}return run.lastReward}",'reward loot')
          s=once(s,"function nextStage(){run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.critLock=0;run.stageIndex++;beginStage()}", "function nextStage(){run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.critLock=0;run.player.regen=0;run.stageIndex++;beginStage()}",'next stage regen')
          marker="function victoryImg(){"
          insert="function lootHtml(){const item=run?.lastLoot;if(!item)return '';const q=QUALITY[item.quality]?.name||'';return `<div class=\"loot-reward quality-border-${esc(item.quality)}\"><b>${esc(q)}掉寶</b><span>${esc(item.name)}</span><small>${esc(itemBonusText(item))}</small></div>`}\n"
          s=once(s,marker,insert+marker,'loot html')
          s=once(s,"${summaryHtml()}${rewardHtml()}${wrongAnalysisHtml()}", "${summaryHtml()}${rewardHtml()}${lootHtml()}${wrongAnalysisHtml()}",'stage clear loot')
          s=once(s,"${summaryHtml()}${win?rewardHtml():''}${wrongAnalysisHtml()}", "${summaryHtml()}${win?rewardHtml()+lootHtml():''}${wrongAnalysisHtml()}",'final loot')
          old="function render(){setMusic(screen==='quiz'?'none':screen==='action'?'fight':'menu');app.innerHTML=screen==='home'?renderHome():screen==='setup'?renderSetup():screen==='cards'?renderCards():screen==='quiz'?renderQuiz():screen==='action'?renderAction():screen==='stage-clear'?renderStageClear():screen==='win'?renderResult(true):screen==='lose'?renderResult(false):renderHome();bind()}"
          new="function render(){setMusic(screen==='quiz'?'none':screen==='action'?'fight':'menu');app.innerHTML=screen==='home'?renderHome():screen==='setup'?renderSetup():screen==='equipment'?renderEquipment():screen==='pet-tree'?renderPetTree():screen==='cards'?renderCards():screen==='quiz'?renderQuiz():screen==='action'?renderAction():screen==='stage-clear'?renderStageClear():screen==='win'?renderResult(true):screen==='lose'?renderResult(false):renderHome();bind()}"
          s=once(s,old,new,'render systems')
          old="function bind(){document.querySelector('[data-action=\"guest-login\"]')?.addEventListener('click',startGuest);"
          new="function bind(){document.querySelector('[data-action=\"guest-login\"]')?.addEventListener('click',startGuest);document.querySelector('[data-action=\"equipment\"]')?.addEventListener('click',()=>{screen='equipment';render()});document.querySelector('[data-action=\"pet-tree\"]')?.addEventListener('click',()=>{screen='pet-tree';render()});document.querySelector('[data-action=\"setup-back\"]')?.addEventListener('click',()=>{screen='setup';render()});document.querySelector('[data-action=\"reset-pet-tree\"]')?.addEventListener('click',()=>{meta.rpg=resetPetSkills(meta.rpg);saveMeta();render()});document.querySelectorAll('[data-equip]').forEach(b=>b.addEventListener('click',()=>{meta.rpg=equipItem(meta.rpg,b.dataset.equip);saveMeta();render()}));document.querySelectorAll('[data-unequip]').forEach(b=>b.addEventListener('click',()=>{meta.rpg=unequipItem(meta.rpg,b.dataset.unequip);saveMeta();render()}));document.querySelectorAll('[data-pet-skill]').forEach(b=>b.addEventListener('click',()=>{const [pet,node]=b.dataset.petSkill.split('|');meta.rpg=unlockPetSkill(pet,node,meta.level,meta.rpg);saveMeta();render()}));"
          s=once(s,old,new,'bind systems')
          p.write_text(s)

          # worker persistence only; PK remains normalized and ignores rpg in progressionStats.
          p=Path('worker/index.js'); s=p.read_text()
          s=once(s,"import {dealHand,makeFighter,resolveCardAction,resolveBasic,resolveAutoBasic,afterAction,cloneFighter,bondMultiplier,supportBoost,isOffensive,applyPetRoundEnd,progressionStats} from '../src/cards.js';", "import {dealHand,makeFighter,resolveCardAction,resolveBasic,resolveAutoBasic,afterAction,cloneFighter,bondMultiplier,supportBoost,isOffensive,applyPetRoundEnd,progressionStats} from '../src/cards.js';\nimport {cleanRpg} from '../src/rpg.js';",'worker rpg import')
          s=once(s,"function progressDefaults(){return {role:'warrior',pet:'fox',level:1,xp:0}}", "function progressDefaults(){return {role:'warrior',pet:'fox',level:1,xp:0,rpg:cleanRpg()}}",'progress defaults')
          s=once(s,"function cleanProgress(input={}){const level=clamp(Math.round(Number(input.level)||1),1,50);return {role:['warrior','mage','archer'].includes(input.role)?input.role:'warrior',pet:['fox','owl','dragon'].includes(input.pet)?input.pet:'fox',level,xp:level>=50?0:Math.max(0,Math.round(Number(input.xp)||0))}}", "function cleanProgress(input={}){const level=clamp(Math.round(Number(input.level)||1),1,50);return {role:['warrior','mage','archer'].includes(input.role)?input.role:'warrior',pet:['fox','owl','dragon'].includes(input.pet)?input.pet:'fox',level,xp:level>=50?0:Math.max(0,Math.round(Number(input.xp)||0)),rpg:cleanRpg(input.rpg)}}",'clean progress')
          p.write_text(s)

          # styles
          p=Path('src/styles.css'); s=p.read_text()
          marker='/* RPG_SYSTEMS_V1 */'
          if marker not in s:
              s += '''\n/* RPG_SYSTEMS_V1 */\n.system-entry{border:0;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:500;justify-self:center;min-width:140px}.equipment-entry{background:#d9e3e9}.pet-tree-entry{background:#e1dbe7}.system-screen{align-items:start}.system-card{width:min(860px,96%);margin:20px auto;background:rgba(249,246,240,.96);border-radius:28px;padding:22px;box-shadow:var(--shadow)}.system-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}.system-head h1{margin:0;text-align:center}.system-head>b{text-align:right}.equip-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.equip-slot{min-height:118px;background:#ebe4da;border-radius:16px;padding:10px;display:grid;align-content:center;gap:5px;text-align:center}.equip-slot small,.loot-item small,.skill-node small{font-size:13px;line-height:1.3}.inventory-list{display:grid;gap:8px;margin-top:16px}.loot-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;background:#f3efe8;border-left:5px solid #b8b2aa}.loot-item>div{display:grid;gap:3px}.mini-system-btn{border:0;border-radius:10px;padding:8px 12px;background:#ddd6cc}.mini-system-btn:disabled{opacity:.35}.quality-common{color:#666963}.quality-rare{color:#55758a}.quality-epic{color:#735f88}.quality-legendary{color:#9b6e25}.quality-border-common{border-color:#a9aaa5}.quality-border-rare{border-color:#7f9dad}.quality-border-epic{border-color:#9a83aa}.quality-border-legendary{border-color:#c49b4a}.empty-system{text-align:center;padding:28px;color:#68716c}.pet-tree-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pet-tree{display:grid;gap:8px;background:#eee9e1;border-radius:18px;padding:12px}.pet-tree h2{text-align:center;margin:0 0 4px}.skill-node{border:1px solid #c9c3ba;border-radius:14px;background:#ded9d1;padding:10px;display:grid;grid-template-columns:1fr auto;gap:3px 8px;text-align:left}.skill-node small{grid-column:1/-1}.skill-node.unlocked{background:#d5e2d7;border-color:#8ea493}.skill-node:disabled:not(.unlocked){opacity:.48}.reset-tree-btn{display:block;margin:16px auto 0}.loot-reward{width:min(360px,100%);margin:8px auto 14px;padding:12px 16px;border-radius:16px;border:2px solid;background:#f4efe7;display:grid;gap:4px}.loot-reward b{font-size:18px}.loot-reward span{font-size:20px}.loot-reward small{font-size:14px}@media(max-width:700px){.system-entry{font-size:16px;padding:8px 12px}.system-card{width:96%;padding:12px;border-radius:20px}.equip-grid{grid-template-columns:repeat(2,1fr)}.equip-slot:last-child{grid-column:1/-1}.pet-tree-grid{grid-template-columns:1fr}.loot-item{padding:9px}.system-head h1{font-size:26px}}\n'''
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/rpg.js
          node --check src/cards.js
          node --check src/game.js
          node --check worker/index.js
      - name: Verify key changes
        run: |
          grep -q "correct===2)return 1.15" src/cards.js
          grep -q "actor.regen=3" src/cards.js
          grep -q "pct:-.5,turns:2" src/cards.js
          grep -q "effectiveDef(actor)\*.14" src/cards.js
          grep -q "function renderEquipment" src/game.js
          grep -q "function renderPetTree" src/game.js
          grep -q "rpg:cleanRpg(input.rpg)" worker/index.js
      - name: Commit source changes
        run: |
          git config user.name "redfisharthur-beep"
          git config user.email "redfisharthur@gmail.com"
          git rm --ignore-unmatch .github/workflows/rpg-progression-systems.yml
          git add src/cards.js src/game.js src/styles.css worker/index.js src/rpg.js
          git commit -m "feat: add loot equipment and shared pet skill trees"
          git push
