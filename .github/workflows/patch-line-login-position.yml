name: Patch LINE login position

on:
  push:
    paths:
      - '.github/workflows/patch-line-login-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adjust LINE login icon position and desktop size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles.css')
          text = path.read_text(encoding='utf-8')

          old_desktop = ".home-panel{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:min(180px,34vw);display:grid;gap:10px}"
          new_desktop = ".home-panel{position:absolute;left:50%;top:47.5%;transform:translate(-50%,-50%);width:min(180px,34vw);display:grid;gap:10px}"

          old_icon = ".line-image-btn{width:54px;height:54px;margin:auto;border:0;background:url('/images/line.png') center/contain no-repeat transparent}"
          new_icon = ".line-image-btn{width:68px;height:68px;margin:auto;border:0;background:url('/images/line.png') center/contain no-repeat transparent}"

          old_mobile = "@media(max-width:700px){.home-panel{width:min(150px,33vw);top:49%}.home-login input{width:80%;justify-self:center;height:38px;font-size:18px}.line-image-btn{width:58px;height:58px}"
          new_mobile = "@media(max-width:700px){.home-panel{width:min(150px,33vw);top:45%}.home-login input{width:80%;justify-self:center;height:38px;font-size:18px}.line-image-btn{width:58px;height:58px}"

          for old, new, label in [
              (old_desktop, new_desktop, 'desktop LINE position'),
              (old_icon, new_icon, 'desktop LINE size'),
              (old_mobile, new_mobile, 'mobile LINE position'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected {label} source not found; refusing to patch.')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-line-login-position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css .github/workflows/patch-line-login-position.yml
          git commit -m "ui: adjust LINE login icon position and desktop size"
          git push
