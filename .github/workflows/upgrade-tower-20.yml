name: Upgrade trial tower to 20 floors
on:
  push:
    paths:
      - '.github/workflows/upgrade-tower-20.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch tower rules at source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          game='src/game.js'
          rpg='src/rpg.js'

          replace_once(game, 'const TOWER_MAX=10;', 'const TOWER_MAX=20;')

          replace_once(
              game,
              "function rawStage(){return run?.mode==='tower'?STAGES[((run.towerFloor||1)-1)%STAGES.length]:STAGES[run.stageIndex]}",
              "function rawStage(){if(run?.mode!=='tower')return STAGES[run.stageIndex];const f=run.towerFloor||1;if(f%5===0)return STAGES[3];return STAGES[(f-1)%3]}"
          )

          old_stage="function stage(){const s=rawStage(),lv=run?.level||meta.level,high=Math.max(0,lv-20);let hp=1+(lv-1)*.06+high*.008,atk=1+(lv-1)*.04+high*.006,def=1+(lv-1)*.035+high*.005,crit=s.crit;let extra='';if(run?.mode==='tower'){const f=run.towerFloor||1;hp*=1+(f-1)*.12+(f>=5?.10:0)+(f>=10?.15:0);atk*=1+(f-1)*.075+(f>=5?.06:0)+(f>=10?.08:0);def*=1+(f-1)*.06+(f>=5?.05:0);crit=Math.min(.42,crit+Math.floor((f-1)/3)*.02)}if(lv>=10){if(s.id==='moss')extra='；低血量會再生';if(s.id==='rabbit')extra='；後段會再突襲';if(s.id==='beetle')extra='；反震更強';if(s.id==='shadow')extra='；吸血與狂暴強化'}return {...s,hp:Math.round(s.hp*hp),atk:Math.round(s.atk*atk),def:Math.round(s.def*def),crit,skillText:s.skillText+extra}}"
          new_stage="function stage(){const s=rawStage(),lv=run?.level||meta.level,high=Math.max(0,lv-20);let hp=1+(lv-1)*.06+high*.008,atk=1+(lv-1)*.04+high*.006,def=1+(lv-1)*.035+high*.005,crit=s.crit;let extra='';if(run?.mode==='tower'){const f=run.towerFloor||1,milestones=(f>=5?1:0)+(f>=10?1:0)+(f>=15?1:0)+(f>=20?1:0);hp*=1+(f-1)*.14+milestones*.12;atk*=1+(f-1)*.09+milestones*.08;def*=1+(f-1)*.075+milestones*.06;crit=Math.min(.50,crit+Math.floor((f-1)/3)*.02+(f>=15?.02:0)+(f>=20?.02:0))}if(lv>=10){if(s.id==='moss')extra='；低血量會再生';if(s.id==='rabbit')extra='；後段會再突襲';if(s.id==='beetle')extra='；反震更強';if(s.id==='shadow')extra='；吸血與狂暴強化'}return {...s,hp:Math.round(s.hp*hp),atk:Math.round(s.atk*atk),def:Math.round(s.def*def),crit,skillText:s.skillText+extra}}"
          replace_once(game, old_stage, new_stage)

          old_reward="const bonus=floor===10?8:floor===5?5:1;"
          new_reward="const bonus=floor===20?20:floor===15?12:floor===10?8:floor===5?5:1;"
          replace_once(game, old_reward, new_reward)

          old_next="function nextStage(){run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.healBlock=[];run.player.stun=0;run.player.critLock=0;run.player.regen=0;run.player.regenFresh=false;if(run.mode==='tower')run.towerFloor=Math.min(TOWER_MAX,(run.towerFloor||1)+1);else run.stageIndex++;beginStage()}"
          new_next="function nextStage(){if(run.mode==='tower'){const nextFloor=Math.min(TOWER_MAX,(run.towerFloor||1)+1),base=progressionStats(meta.role,meta.pet,run.level,meta.rpg).total,carry=nextFloor<=5?.75:nextFloor<=10?.65:nextFloor<=15?.55:.45;run.player.maxHp=Math.round(base.maxHp+Math.max(0,run.player.maxHp-base.maxHp)*carry);run.player.atk=Math.round(base.atk+Math.max(0,run.player.atk-base.atk)*carry);run.player.def=Math.round(base.def+Math.max(0,run.player.def-base.def)*carry);run.player.crit=Math.min(.85,base.crit+Math.max(0,run.player.crit-base.crit)*carry);run.player.shield=Math.round(Math.max(0,run.player.shield||0)*.25);run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.12));run.towerFloor=nextFloor}else{run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.stageIndex++}run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.healBlock=[];run.player.stun=0;run.player.critLock=0;run.player.regen=0;run.player.regenFresh=false;beginStage()}"
          replace_once(game, old_next, new_next)

          replace_once(rpg, "const collection=[...collectionSet],towerBest=clamp(Math.round(Number(src.towerBest)||0),0,10);", "const collection=[...collectionSet],towerBest=clamp(Math.round(Number(src.towerBest)||0),0,20);")
          replace_once(rpg, "export function recordTowerFloor(rpg,floor){const clean=cleanRpg(rpg);clean.towerBest=Math.max(clean.towerBest,clamp(Math.round(Number(floor)||0),0,10));return cleanRpg(clean);}", "export function recordTowerFloor(rpg,floor){const clean=cleanRpg(rpg);clean.towerBest=Math.max(clean.towerBest,clamp(Math.round(Number(floor)||0),0,20));return cleanRpg(clean);}")
          replace_once(rpg, "const floor=clamp(Math.round(Number(towerFloor)||0),0,10),chance=boss?.03:floor>=10?.12:floor>=8?.04:0;", "const floor=clamp(Math.round(Number(towerFloor)||0),0,20),chance=boss?.03:floor>=20?.30:floor>=15?.18:floor>=10?.12:floor>=8?.04:0;")

          test=Path('tests/rpg-systems.mjs')
          s=test.read_text()
          anchor="let tower=recordTowerFloor(emptyRpg(),7);tower=recordTowerFloor(tower,4);assert.equal(tower.towerBest,7);"
          if s.count(anchor)!=1:
              raise SystemExit('tower test anchor mismatch')
          s=s.replace(anchor, anchor+"tower=recordTowerFloor(tower,20);assert.equal(tower.towerBest,20);tower=recordTowerFloor(tower,99);assert.equal(tower.towerBest,20);",1)
          test.write_text(s)
          PY
      - name: Verify source and tests
        run: |
          node --check src/game.js
          node --check src/rpg.js
          node --check src/cards.js
          node --check src/pk.js
          node --check worker/index.js
          npm test
          grep -q 'const TOWER_MAX=20;' src/game.js
          grep -q "floor>=20?.30:floor>=15?.18:floor>=10?.12" src/rpg.js
          grep -q 'towerBest=clamp(Math.round(Number(src.towerBest)||0),0,20)' src/rpg.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/rpg.js tests/rpg-systems.mjs
          git commit -m 'feat: expand trial tower to 20 floors'
          git push origin main
          git rm .github/workflows/upgrade-tower-20.yml
          git commit -m 'chore: remove temporary tower upgrade workflow'
          git push origin main
