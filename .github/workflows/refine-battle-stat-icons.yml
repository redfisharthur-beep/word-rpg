name: Refine battle stat icons
on:
  push:
    paths:
      - '.github/workflows/refine-battle-stat-icons.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update original source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          old_stat='function statItem(src,value,label){return `<span class="battle-stat-line">${uiImg(src,label,\'\')}<em>${esc(label)}</em><b>${esc(value)}</b></span>`}'
          new_stat='function statItem(src,value,label){return `<span class="battle-stat-line">${uiImg(src,label,\'\')}<b>${esc(value)}</b></span>`}'
          replace_once('src/game.js',old_stat,new_stat)
          replace_once('src/pk.js',old_stat,new_stat)

          old_monster='.monster-skill{display:grid;gap:3px;margin:6px auto 0;max-width:270px;line-height:1.3}.monster-skill b{font-size:18px;color:#684944}.monster-skill span{font-size:16px;color:#4d4542;font-weight:500}'
          new_monster='.monster-skill{display:none}'
          replace_once('src/styles.css',old_monster,new_monster)

          old_stats='.stat-row{display:grid;grid-template-columns:1fr;justify-items:center;gap:4px;margin-top:9px}.stat-row .battle-stat-line{display:grid;grid-template-columns:26px 58px minmax(46px,auto);align-items:center;gap:6px;padding:0;background:transparent;border-radius:0;color:#36413c;font-weight:500;line-height:1.05}.battle-stat-line img{display:block;width:24px;height:24px;object-fit:contain}.battle-stat-line em{font-style:normal;font-size:14px;text-align:left;white-space:nowrap}.battle-stat-line b{font-size:15px;text-align:right;white-space:nowrap}.stat-spacer{display:block;width:24px;height:24px}'
          new_stats='.stat-row{display:grid;grid-template-columns:1fr;justify-items:center;gap:5px;margin-top:9px}.stat-row .battle-stat-line{display:grid;grid-template-columns:32px minmax(46px,auto);align-items:center;gap:7px;padding:0;background:transparent;border-radius:0;color:#36413c;font-weight:500;line-height:1.05}.stat-row .shield-stat{grid-template-columns:32px 52px minmax(46px,auto)}.battle-stat-line img{display:block;width:28px;height:28px;object-fit:contain}.battle-stat-line em{font-style:normal;font-size:14px;text-align:left;white-space:nowrap}.battle-stat-line b{font-size:15px;text-align:right;white-space:nowrap}.stat-spacer{display:block;width:28px;height:28px}'
          replace_once('src/styles.css',old_stats,new_stats)

          old_mobile='.stat-row{gap:3px}.stat-row .battle-stat-line{grid-template-columns:22px 52px minmax(42px,auto);gap:4px}.battle-stat-line img{width:21px;height:21px}.battle-stat-line em{font-size:12px}.battle-stat-line b{font-size:13px}.stat-spacer{width:21px;height:21px}'
          new_mobile='.stat-row{gap:4px}.stat-row .battle-stat-line{grid-template-columns:28px minmax(42px,auto);gap:5px}.stat-row .shield-stat{grid-template-columns:28px 46px minmax(42px,auto)}.battle-stat-line img{width:25px;height:25px}.battle-stat-line em{font-size:12px}.battle-stat-line b{font-size:13px}.stat-spacer{width:25px;height:25px}'
          replace_once('src/styles.css',old_mobile,new_mobile)
          PY
      - name: Verify
        shell: bash
        run: |
          node --check src/game.js
          node --check src/pk.js
          grep -Fq 'function statItem(src,value,label){return `<span class="battle-stat-line">${uiImg(src,label,' src/game.js
          ! grep -Fq '<em>${esc(label)}</em>' src/game.js
          ! grep -Fq '<em>${esc(label)}</em>' src/pk.js
          grep -Fq '.monster-skill{display:none}' src/styles.css
          grep -Fq 'width:28px;height:28px' src/styles.css
          grep -Fq 'width:25px;height:25px' src/styles.css
          grep -Fq '<em>護盾</em>' src/game.js
          grep -Fq '<em>護盾</em>' src/pk.js
      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name 'redfisharthur-beep'
          git config user.email 'redfisharthur@gmail.com'
          git rm .github/workflows/refine-battle-stat-icons.yml
          git add src/game.js src/pk.js src/styles.css
          git commit -m 'ui: simplify battle stats to icons'
          git push
