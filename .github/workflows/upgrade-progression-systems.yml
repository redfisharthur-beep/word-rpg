6px}.progression-btn small{font-size:11px}.resonance-panel{grid-template-columns:1fr;gap:5px}.resonance-chip{padding:7px 9px}.collection-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.collection-card{min-height:118px;padding:7px 4px}.collection-art{width:60px;height:60px}.collection-card b{font-size:12px}.collection-card small{font-size:10px}.loot-item-actions{justify-content:flex-start}}\n'''
