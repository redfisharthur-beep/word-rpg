name: Upgrade progression systems
on:
  push:
    paths:
      - '.github/workflows/upgrade-progression-systems.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          def replace_once(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old,new,1)

          def replace_between(text, start, end, new, label):
              pattern=re.escape(start)+r'.*?'+re.escape(end)
              m=re.search(pattern,text,re.S)
              if not m:
                  raise SystemExit(f'{label}: range not found')
              return text[:m.start()]+new+text[m.end():]

          # ---------- src/rpg.js ----------
          p=Path('src/rpg.js'); s=p.read_text()
          s=replace_once(s,
          "export const PET_ENHANCE_COST=[5,10,20,40];",
          "export const PET_ENHANCE_COST=[5,10,20,40];\nexport const PET_AWAKENING={\n  fox:{name:'九尾覺醒',desc:'先手第一張牌再 +15%，紅牌追擊再 +10%'},\n  owl:{name:'星夜覺醒',desc:'1 題答對效果再 +10%，綠／藍牌續航再 +5%'},\n  dragon:{name:'真龍覺醒',desc:'黃牌效果再 +10%，終式爆發再 +10%'}\n};",
          'pet awakening const')

          marker="export function emptyRpg(){return {inventory:[],equipped:{gems:[],armor:null,rings:[]},crystals:0,petEnhance:{fox:0,owl:0,dragon:0},petSkills:{fox:[],owl:[],dragon:[]}};}"
          helpers="""export function collectionKey(item){return item?.type&&item?.subtype&&item?.quality?`${item.type}:${item.subtype}:${item.quality}`:'';}\nfunction validCollectionKey(key){const [type,subtype,quality]=String(key||'').split(':');return !!(VALID_LOOT[type]?.has(subtype)&&QUALITY[quality]);}\nexport function collectionEntries(){const defs={gem:['ruby','thunder'],armor:['guardian','bloodspirit'],ring:['warbreaker','battlesoul']},out=[];for(const [type,subs] of Object.entries(defs))for(const subtype of subs)for(const quality of QUALITY_ORDER){const item={type,subtype,quality,name:`${QUALITY[quality].name}${ITEM_NAME[subtype]}`,bonuses:bonusesFor(type,subtype,quality)};out.push({...item,key:collectionKey(item),art:lootImage(item)})}return out;}\nexport function collectionProgress(rpg){const clean=cleanRpg(rpg),total=collectionEntries().length;return {owned:clean.collection.length,total};}\n\nexport function emptyRpg(){return {inventory:[],equipped:{gems:[],armor:null,rings:[]},crystals:0,petEnhance:{fox:0,owl:0,dragon:0},petSkills:{fox:[],owl:[],dragon:[]},collection:[],towerBest:0};}"""
          s=replace_once(s,marker,helpers,'rpg base state')

          oldret="return {...base,inventory,equipped:{gems,armor,rings},crystals,petEnhance,petSkills};"
          newret="""const collectionSet=new Set((Array.isArray(src.collection)?src.collection:[]).filter(validCollectionKey));\n  for(const item of inventory){const key=collectionKey(item);if(key)collectionSet.add(key);}\n  const collection=[...collectionSet],towerBest=clamp(Math.round(Number(src.towerBest)||0),0,10);\n  return {...base,inventory,equipped:{gems,armor,rings},crystals,petEnhance,petSkills,collection,towerBest};"""
          s=replace_once(s,oldret,newret,'cleanRpg persistence')

          crystallize="export function crystallizeItem(rpg,itemId){const clean=cleanRpg(rpg),equipped=new Set([...clean.equipped.gems,clean.equipped.armor,...clean.equipped.rings].filter(Boolean));if(equipped.has(itemId))return clean;const item=clean.inventory.find(x=>x.id===itemId);if(!item)return clean;const gain=crystalValue(item);if(!gain)return clean;clean.inventory=clean.inventory.filter(x=>x.id!==itemId);clean.crystals+=gain;return cleanRpg(clean);}"
          synth=crystallize+"""\nexport function synthesisInfo(rpg,itemId){const clean=cleanRpg(rpg),item=clean.inventory.find(x=>x.id===itemId),equipped=new Set([...clean.equipped.gems,clean.equipped.armor,...clean.equipped.rings].filter(Boolean));if(!item)return {can:false,count:0,nextQuality:null};const qi=QUALITY_ORDER.indexOf(item.quality);if(qi<0||qi>=QUALITY_ORDER.length-1)return {can:false,count:0,nextQuality:null};const matches=clean.inventory.filter(x=>!equipped.has(x.id)&&x.type===item.type&&x.subtype===item.subtype&&x.quality===item.quality);return {can:matches.length>=3,count:matches.length,nextQuality:QUALITY_ORDER[qi+1],consumeIds:matches.slice(0,3).map(x=>x.id)};}\nexport function synthesizeItem(rpg,itemId){const clean=cleanRpg(rpg),info=synthesisInfo(clean,itemId),item=clean.inventory.find(x=>x.id===itemId);if(!item||!info.can)return clean;const consume=new Set(info.consumeIds);clean.inventory=clean.inventory.filter(x=>!consume.has(x.id));const made={...makeItem(item.type,item.subtype,info.nextQuality),crafted:true,foundAt:Date.now()};clean.inventory.push(made);const key=collectionKey(made);if(key&&!clean.collection.includes(key))clean.collection.push(key);return cleanRpg(clean);}\nexport function recordTowerFloor(rpg,floor){const clean=cleanRpg(rpg);clean.towerBest=Math.max(clean.towerBest,clamp(Math.round(Number(floor)||0),0,10));return cleanRpg(clean);}\n"""
          s=replace_once(s,crystallize,synth,'synthesis block')

          pet_tail="""  if(pet==='dragon'){\n    if(owned.has('dragon-1'))out.yellowAmp+=.04;if(owned.has('dragon-2'))out.finisherAmp+=.05;if(owned.has('dragon-3'))out.atkPct+=.04;if(owned.has('dragon-4'))out.yellowAmp+=.06;if(owned.has('dragon-5')){out.finisherAmp+=.10;out.crit+=.03;}\n  }\n  return out;\n}"""
          pet_new="""  if(pet==='dragon'){\n    if(owned.has('dragon-1'))out.yellowAmp+=.04;if(owned.has('dragon-2'))out.finisherAmp+=.05;if(owned.has('dragon-3'))out.atkPct+=.04;if(owned.has('dragon-4'))out.yellowAmp+=.06;if(owned.has('dragon-5')){out.finisherAmp+=.10;out.crit+=.03;}\n  }\n  if((clean.petEnhance?.[pet]||0)>=4){out.awakened=true;if(pet==='fox'){out.firstCardAmp+=.15;out.chaseAmp+=.10}if(pet==='owl'){out.oneAccuracy+=.10;out.guardHeal+=.05}if(pet==='dragon'){out.yellowAmp+=.10;out.finisherAmp+=.10}}\n  return out;\n}"""
          s=replace_once(s,pet_tail,pet_new,'pet awakening effects')

          eq_marker="export function equipmentBonuses(rpg){"
          resonance="""export function equipmentResonance(rpg){\n  const clean=cleanRpg(rpg),byId=new Map(clean.inventory.map(x=>[x.id,x])),ids=[...clean.equipped.gems,clean.equipped.armor,...clean.equipped.rings].filter(Boolean),items=ids.map(id=>byId.get(id)).filter(Boolean),count=sub=>items.filter(x=>x.subtype===sub).length;\n  const recipes=[\n    {id:'war',name:'烈戰共鳴',desc:'2 紅曜石＋破軍戒｜每回合第一張牌 +12%',active:count('ruby')>=2&&count('warbreaker')>=1},\n    {id:'blood',name:'血靈共鳴',desc:'2 雷光石＋血靈甲｜綠牌效果 +15%',active:count('thunder')>=2&&count('bloodspirit')>=1},\n    {id:'guard',name:'鐵壁共鳴',desc:'守護甲＋戰魂戒｜藍牌效果 +15%',active:count('guardian')>=1&&count('battlesoul')>=1}\n  ];\n  const out={recipes,active:recipes.filter(x=>x.active),firstCardAmp:0,greenAmp:0,blueAmp:0};\n  if(recipes[0].active)out.firstCardAmp=.12;if(recipes[1].active)out.greenAmp=.15;if(recipes[2].active)out.blueAmp=.15;return out;\n}\n\nexport function equipmentBonuses(rpg){"""
          s=replace_once(s,eq_marker,resonance,'equipment resonance')
          p.write_text(s)

          # ---------- src/cards.js ----------
          p=Path('src/cards.js'); s=p.read_text()
          s=replace_once(s,"import {equipmentBonuses,petSkillEffects,petEnhanceLevel} from './rpg.js';","import {equipmentBonuses,petSkillEffects,petEnhanceLevel,equipmentResonance} from './rpg.js';",'cards import')
          s=replace_once(s,"const logs=[],acc=accuracyMultiplier(correct,actor),petFx=petSkillEffects(actor?.pet,actor?.rpg||{});","const logs=[],acc=accuracyMultiplier(correct,actor),petFx=petSkillEffects(actor?.pet,actor?.rpg||{}),resonance=equipmentResonance(actor?.rpg||{});",'resonance context')
          s=replace_once(s,"let roleAmp=1,petAmp=1;","let roleAmp=1,petAmp=1,resAmp=1;",'res amp init')
          old="""  if(actor.pet==='dragon'&&yellowCount>=2&&slotIndex===cards.length-1){const amp=.30+petFx.finisherAmp;petAmp*=1+amp;logs.push(`幼龍終式爆發 +${Math.round(amp*100)}%`);}\n  applyCard(card,actor,target,acc*bond*boost*roleAmp*petAmp,logs);"""
          new="""  if(actor.pet==='dragon'&&yellowCount>=2&&slotIndex===cards.length-1){const amp=.30+petFx.finisherAmp;petAmp*=1+amp;logs.push(`幼龍終式爆發 +${Math.round(amp*100)}%`);}\n  if(slotIndex===0&&resonance.firstCardAmp>0){resAmp*=1+resonance.firstCardAmp;logs.push(`烈戰共鳴 +${Math.round(resonance.firstCardAmp*100)}%`);}\n  if(card.color==='green'&&resonance.greenAmp>0){resAmp*=1+resonance.greenAmp;logs.push(`血靈共鳴 +${Math.round(resonance.greenAmp*100)}%`);}\n  if(card.color==='blue'&&resonance.blueAmp>0){resAmp*=1+resonance.blueAmp;logs.push(`鐵壁共鳴 +${Math.round(resonance.blueAmp*100)}%`);}\n  applyCard(card,actor,target,acc*bond*boost*roleAmp*petAmp*resAmp,logs);"""
          s=replace_once(s,old,new,'apply resonance')
          p.write_text(s)

          # ---------- src/game.js ----------
          p=Path('src/game.js'); s=p.read_text()
          old_import="import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,itemBonusText,lootImage,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills,crystalValue,crystallizeItem,petEnhanceLevel,petEnhanceCost,enhancePet} from './rpg.js';"
          new_import="import {emptyRpg,cleanRpg,rollLoot,addLoot,equipItem,unequipItem,itemBonusText,lootImage,QUALITY,PET_TREES,availableSkillPoints,canUnlockPetSkill,unlockPetSkill,resetPetSkills,crystalValue,crystallizeItem,petEnhanceLevel,petEnhanceCost,enhancePet,synthesisInfo,synthesizeItem,equipmentResonance,collectionEntries,collectionProgress,PET_AWAKENING,recordTowerFloor} from './rpg.js';"
          s=replace_once(s,old_import,new_import,'game import')
          s=replace_once(s,"];\nconst CARD_HINT=", "];\nconst TOWER_MAX=10;\nconst CARD_HINT=", 'tower const')

          raw_old="function rawStage(){return STAGES[run.stageIndex]}\nfunction stage(){const s=rawStage(),lv=run?.level||meta.level,high=Math.max(0,lv-20),hp=1+(lv-1)*.06+high*.008,atk=1+(lv-1)*.04+high*.006,def=1+(lv-1)*.035+high*.005;let extra='';if(lv>=10){if(s.id==='moss')extra='；低血量會再生';if(s.id==='rabbit')extra='；後段會再突襲';if(s.id==='beetle')extra='；反震更強';if(s.id==='shadow')extra='；吸血與狂暴強化'}return {...s,hp:Math.round(s.hp*hp),atk:Math.round(s.atk*atk),def:Math.round(s.def*def),skillText:s.skillText+extra}}\nfunction role()"
          raw_new="""function rawStage(){return run?.mode==='tower'?STAGES[((run.towerFloor||1)-1)%STAGES.length]:STAGES[run.stageIndex]}\nfunction stage(){const s=rawStage(),lv=run?.level||meta.level,high=Math.max(0,lv-20);let hp=1+(lv-1)*.06+high*.008,atk=1+(lv-1)*.04+high*.006,def=1+(lv-1)*.035+high*.005,crit=s.crit;let extra='';if(run?.mode==='tower'){const f=run.towerFloor||1;hp*=1+(f-1)*.12+(f>=5?.10:0)+(f>=10?.15:0);atk*=1+(f-1)*.075+(f>=5?.06:0)+(f>=10?.08:0);def*=1+(f-1)*.06+(f>=5?.05:0);crit=Math.min(.42,crit+Math.floor((f-1)/3)*.02)}if(lv>=10){if(s.id==='moss')extra='；低血量會再生';if(s.id==='rabbit')extra='；後段會再突襲';if(s.id==='beetle')extra='；反震更強';if(s.id==='shadow')extra='；吸血與狂暴強化'}return {...s,hp:Math.round(s.hp*hp),atk:Math.round(s.atk*atk),def:Math.round(s.def*def),crit,skillText:s.skillText+extra}}\nfunction role()"""
          s=replace_once(s,raw_old,raw_new,'tower stage scaling')

          s=replace_between(s,"function startRun(){","\nfunction beginStage(){", """function startMode(mode='adventure'){clearTimers();answerFeedback=null;if(meta.authMode==='guest'){meta.level=1;meta.xp=0;persistLocal()}const level=meta.authMode==='guest'?1:meta.level,p=progressionStats(meta.role,meta.pet,level,meta.rpg).total;run={mode,towerFloor:1,level,stageIndex:0,player:makeFighter({...p,role:meta.role,pet:meta.pet,rpg:meta.rpg}),enemy:null,round:1,hand:dealHand(9,meta.role,level),enemyHand:dealHand(9),used:[],enemyUsed:[],selected:[],enemySelected:[],correct:0,qIndex:0,qs:[],quizStarted:0,questionDeadline:0,selectDeadline:0,log:[],lastOrder:'',steps:[],stepIndex:0,actionStartPlayer:null,actionStartEnemy:null,stats:freshStats(),wrongAnswers:[],wordDeck:wordDeck(),stageRewarded:false,lastReward:null,lastLoot:null,lastCrystals:0};beginStage()}\nfunction startRun(){startMode('adventure')}\nfunction startTower(){startMode('tower')}\nfunction beginStage(){""", 'start modes')
          s=replace_once(s,"run.lastReward=null;run.lastLoot=null;screen='cards';render()","run.lastReward=null;run.lastLoot=null;run.lastCrystals=0;screen='cards';render()",'begin stage reset')

          s=replace_between(s,"function renderSetup(){","\nfunction equipmentSlot", """function renderSetup(){const r=ROLES[meta.role]||ROLES.warrior,p=PETS[meta.pet]||PETS.fox,g=growth(),col=collectionProgress(meta.rpg),best=meta.rpg.towerBest||0;return `<main class=\"setup-screen\"><section class=\"setup-card\"><section class=\"choice-section\"><div class=\"choice-feature role-feature theme-${esc(meta.role)} growth-feature\"><div class=\"growth-art role-growth-art\">${uiImg(r.art,r.name,'')}</div>${growthPanel(g.role,'role')}</div><div class=\"choice-tabs\">${Object.entries(ROLES).map(([id,x])=>`<button class=\"choice-tab ${meta.role===id?'active':''}\" data-role=\"${id}\">${esc(x.name)}</button>`).join('')}</div></section><section class=\"choice-section pet-section\"><div class=\"choice-feature pet-feature theme-${esc(meta.pet)} growth-feature\"><div class=\"growth-art pet-growth-art\">${uiImg(p.art,p.name,'')}</div>${growthPanel(g.pet,'pet')}</div><div class=\"choice-tabs\">${Object.entries(PETS).map(([id,x])=>`<button class=\"choice-tab ${meta.pet===id?'active':''}\" data-pet=\"${id}\">${esc(x.name)}</button>`).join('')}</div></section><div class=\"setup-actions setup-actions-four\">${imageButton(ASSETS.ui.equipment,'裝備','data-action=\"equipment\"')}${imageButton(ASSETS.ui.fight,'開始冒險','data-action=\"start\"')}${imageButton(ASSETS.ui.pk,'線上對戰','data-action=\"pk\"')}${imageButton(ASSETS.ui.petSkill,'寵物技能','data-action=\"pet-tree\"')}</div><div class=\"progression-actions\"><button class=\"progression-btn tower-entry\" data-action=\"tower\"><b>試煉塔</b><small>最高 ${best}/${TOWER_MAX}</small></button><button class=\"progression-btn collection-entry\" data-action=\"collection\"><b>收藏圖鑑</b><small>${col.owned}/${col.total}</small></button></div></section></main>`}\nfunction equipmentSlot""", 'setup progression entries')

          s=replace_between(s,"function renderEquipment(){","\nfunction renderPetTree(){", """function resonanceHtml(){const r=equipmentResonance(meta.rpg);return `<section class=\"resonance-panel\">${r.recipes.map(x=>`<div class=\"resonance-chip ${x.active?'active':''}\"><b>${esc(x.name)}</b><small>${esc(x.desc)}</small></div>`).join('')}</section>`}\nfunction renderEquipment(){const eq=meta.rpg.equipped,rings=eq.rings||[],equipped=new Set([...eq.gems,eq.armor,...rings].filter(Boolean)),items=[...meta.rpg.inventory].filter(item=>!equipped.has(item.id)).reverse();return `<main class=\"setup-screen system-screen\"><section class=\"system-card\"><div class=\"system-head\">${systemBackButton()}<span></span><b class=\"crystal-count\">結晶 ${meta.rpg.crystals||0}</b></div><div class=\"equip-groups\">${equipmentGroup('寶石','gems',[0,1,2].map(i=>equipmentSlot(eq.gems[i])))}${equipmentGroup('裝甲','armor',[equipmentSlot(eq.armor)])}${equipmentGroup('戒指','rings',[0,1].map(i=>equipmentSlot(rings[i])))}</div>${resonanceHtml()}<div class=\"inventory-list\">${items.length?items.map(item=>{const gemFull=item.type==='gem'&&eq.gems.length>=3,ringFull=item.type==='ring'&&rings.length>=2,full=gemFull||ringFull,syn=synthesisInfo(meta.rpg,item.id);return `<div class=\"loot-item quality-border-${esc(item.quality)}\">${lootArt(item)}<div><b class=\"quality-${esc(item.quality)}\">${esc(item.name)}</b><small>${esc(itemBonusText(item))}</small></div><div class=\"loot-item-actions\"><button class=\"mini-system-btn\" data-equip=\"${esc(item.id)}\" ${full?'disabled':''}>裝備</button>${item.quality!=='legendary'?`<button class=\"mini-system-btn synth-btn\" data-synthesize=\"${esc(item.id)}\" ${syn.can?'':'disabled'}>合成 ${Math.min(3,syn.count)}/3</button>`:''}<button class=\"mini-system-btn crystal-btn\" data-crystallize=\"${esc(item.id)}\">結晶 +${crystalValue(item)}</button></div></div>`}).join(''):'<div class=\"empty-system\">沒有多餘裝備</div>'}</div></section></main>`}\nfunction renderPetTree(){""", 'equipment synthesis resonance')

          s=replace_between(s,"function renderPetTree(){","\nfunction statItem", """function renderPetTree(){const points=availableSkillPoints(meta.level,meta.rpg),crystals=meta.rpg.crystals||0;return `<main class=\"setup-screen system-screen\"><section class=\"system-card\"><div class=\"system-head\">${systemBackButton()}<span></span><b>${points} 點 · 結晶 ${crystals}</b></div><div class=\"pet-tree-grid\">${Object.entries(PET_TREES).map(([pet,tree])=>{const owned=new Set(meta.rpg.petSkills[pet]||[]),enhance=petEnhanceLevel(pet,meta.rpg),cost=petEnhanceCost(pet,meta.rpg),max=enhance>=4,can=max?false:crystals>=cost,awakening=PET_AWAKENING[pet];return `<section class=\"pet-tree ${max?'awakened':''}\"><div class=\"pet-tree-head\"><div><h2>${esc(PETS[pet]?.name||pet)}</h2><small>${max?'覺醒 Lv.4/4':`強化 Lv.${enhance}/4 · 寵物能力 +${enhance*10}% · 下次 ${cost} 結晶`}</small></div><button class=\"mini-system-btn pet-enhance-btn\" data-pet-enhance=\"${pet}\" ${can?'':'disabled'}>${max?'覺醒':'強化'}</button></div>${max?`<div class=\"awakening-note\"><b>${esc(awakening.name)}</b><small>${esc(awakening.desc)}</small></div>`:''}${tree.map(node=>{const got=owned.has(node.id),ok=canUnlockPetSkill(pet,node.id,meta.level,meta.rpg);return `<button class=\"skill-node ${got?'unlocked':''}\" data-pet-skill=\"${pet}|${node.id}\" ${got||!ok?'disabled':''}><b>${esc(node.name)}</b><span>${node.cost} 點</span><small>${esc(node.desc)}</small></button>`}).join('')}</section>`}).join('')}</div><button class=\"secondary-btn reset-tree-btn\" data-action=\"reset-pet-tree\">重置技能樹</button></section></main>`}\nfunction renderCollection(){const entries=collectionEntries(),owned=new Set(meta.rpg.collection||[]),progress=collectionProgress(meta.rpg);return `<main class=\"setup-screen system-screen\"><section class=\"system-card collection-screen\"><div class=\"system-head\">${systemBackButton()}<span></span><b>${progress.owned}/${progress.total}</b></div><div class=\"collection-grid\">${entries.map(item=>{const got=owned.has(item.key);return `<div class=\"collection-card ${got?'owned':'locked'} quality-border-${esc(item.quality)}\">${lootArt(item,'collection-art')}<b class=\"quality-${esc(item.quality)}\">${esc(item.name)}</b><small>${got?esc(itemBonusText(item)):'尚未收集'}</small></div>`}).join('')}</div></section></main>`}\nfunction statItem""", 'pet awakening and collection')

          s=replace_between(s,"function combatHeader(","\nfunction cardHint", """function combatHeader({playerState=run.player,enemyState=run.enemy,activeStep=null,showChosen=false,visualMeta=null}={}){const s=stage(),php=clamp(playerState.hp/playerState.maxHp*100,0,100),ehp=clamp(enemyState.hp/enemyState.maxHp*100,0,100),pc=run.round<=3?run.selected.map(i=>run.hand[i]):[],ec=run.round<=3?run.enemySelected.map(i=>run.enemyHand[i]):[],heroAct=activeStep?.who==='player',enemyAct=activeStep?.who==='enemy',selfFx=visualMeta?.self,fxOnHero=visualMeta&&(selfFx?heroAct:enemyAct),fxOnEnemy=visualMeta&&(selfFx?enemyAct:heroAct),effect=visualMeta?.kind?ASSETS.effect[visualMeta.kind]:null,stagePadding=showChosen&&run.round<=3?'':'padding-bottom:30px;',progress=run.mode==='tower'?`試煉 ${run.towerFloor}/${TOWER_MAX}`:`${run.stageIndex+1}/${STAGES.length}`;return `<header class=\"battle-top\"><button data-action=\"quit\" aria-label=\"返回\" style=\"border:0;background:transparent;padding:0;justify-self:start;width:132px\">${uiImg(ASSETS.ui.back,'返回','display:block;width:100%;height:auto;object-fit:contain;')}</button><span></span><span>${progress}</span></header><section class=\"combat-stage focus-stage ${activeStep?'impact-stage':''} ${visualMeta?.crit?'critical-stage':''}\" style=\"${stagePadding}\"><div class=\"fighter hero ${heroAct?'is-acting':''} ${enemyAct&&!selfFx?'is-hit':''}\">${visual(role().art,'','fighter-art')}<div class=\"name-line\">${esc(meta.playerName)}</div><div class=\"hp\"><i style=\"width:${php}%\"></i></div>${stats(playerState)}${fxOnHero&&effect?`<img class=\"battle-effect ${visualMeta.kind}\" src=\"${effect}\" alt=\"\">`:''}${fxOnHero&&visualMeta.amount?`<span class=\"impact-number ${visualMeta.kind}\">${visualMeta.amount}</span>`:''}</div><div class=\"battle-center\">${uiImg(ASSETS.ui.vs,'VS','display:block;width:min(132px,20vw);height:auto;object-fit:contain;margin:auto;')}</div><div class=\"fighter enemy ${enemyAct?'is-acting':''} ${heroAct&&!selfFx?'is-hit':''}\">${visual(s.art,'','fighter-art')}<div class=\"name-line\">${esc(s.name)}</div><div class=\"hp enemy-hp\"><i style=\"width:${ehp}%\"></i></div>${stats(enemyState)}${fxOnEnemy&&effect?`<img class=\"battle-effect ${visualMeta.kind}\" src=\"${effect}\" alt=\"\">`:''}${fxOnEnemy&&visualMeta.amount?`<span class=\"impact-number ${visualMeta.kind}\">${visualMeta.amount}</span>`:''}</div>${showChosen&&run.round<=3?`<div class=\"combat-card-rail player-rail\">${selectedCardsHtml(pc,activeStep?.who==='player'?activeStep.slot:-1,false)}</div><div class=\"combat-card-rail enemy-rail\">${selectedCardsHtml(ec,activeStep?.who==='enemy'?activeStep.slot:-1,true)}</div>`:''}</section>`}\nfunction cardHint""", 'tower header')

          s=replace_between(s,"function rewardStage(){","\nfunction lootHtml(){", """function rewardStage(){if(run.stageRewarded)return run.lastReward;run.stageRewarded=true;const tower=run.mode==='tower',floor=run.towerFloor||1;run.lastReward=addXp(tower?100+floor*15:80+run.stageIndex*25);run.lastLoot=null;run.lastCrystals=0;if(meta.authMode!=='guest'){if(tower){const bonus=floor===10?8:floor===5?5:1;let next=cleanRpg(meta.rpg);next.crystals+=bonus;meta.rpg=recordTowerFloor(next,floor);run.lastCrystals=bonus}const lootStage=tower?(floor%5===0?3:Math.min(3,Math.floor((floor-1)/3))):run.stageIndex,item=rollLoot(lootStage,run.level);if(item){meta.rpg=addLoot(meta.rpg,item);run.lastLoot=item}saveMeta()}return run.lastReward}\nfunction finishBattle(){const p=run.player.hp/run.player.maxHp,e=run.enemy.hp/run.enemy.maxHp,win=run.enemy.hp<=0||(run.player.hp>0&&p>=e);if(!win){screen='lose';render();return}rewardStage();if(run.mode==='tower'){if((run.towerFloor||1)>=TOWER_MAX){screen='win';render();return}screen='stage-clear';render();return}if(run.stageIndex>=STAGES.length-1){screen='win';render();return}screen='stage-clear';render()}\nfunction nextStage(){run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.critLock=0;run.player.regen=0;run.player.regenFresh=false;if(run.mode==='tower')run.towerFloor=Math.min(TOWER_MAX,(run.towerFloor||1)+1);else run.stageIndex++;beginStage()}\nfunction rewardHtml(){const r=run?.lastReward;if(!r)return '';const crystal=run?.lastCrystals?`<div class=\"growth-reward tower-reward\"><b>結晶 +${run.lastCrystals}</b><span>試煉最高 ${meta.rpg.towerBest||0}/${TOWER_MAX}</span></div>`:'';if(r.guest)return `<div class=\"growth-reward\"><b>訪客模式</b><span>不累積 EXP · 角色不升級</span></div>`;if(r.max)return `<div class=\"growth-reward\"><b>Lv.50 · 滿級</b><span>${esc(titleFor(50))}</span></div>${crystal}`;return `<div class=\"growth-reward\"><b>EXP +${r.amount}</b><span>Lv.${meta.level} · ${esc(titleFor(meta.level))}</span></div>${r.levels.length?`<div class=\"level-up-standalone\">${uiImg(ASSETS.ui.levelUp,'升級','display:block;width:min(230px,62vw);max-height:100px;object-fit:contain;margin:0 auto;')}</div>`:''}${crystal}`}\nfunction lootHtml(){""", 'tower rewards')

          s=replace_between(s,"function render(){","\nrender();", """function render(){setMusic(screen==='quiz'?'none':screen==='action'?'fight':'menu');app.innerHTML=screen==='home'?renderHome():screen==='setup'?renderSetup():screen==='equipment'?renderEquipment():screen==='pet-tree'?renderPetTree():screen==='collection'?renderCollection():screen==='cards'?renderCards():screen==='quiz'?renderQuiz():screen==='action'?renderAction():screen==='stage-clear'?renderStageClear():screen==='win'?renderResult(true):screen==='lose'?renderResult(false):renderHome();bind()}\nfunction bind(){document.querySelector('[data-action=\"guest-login\"]')?.addEventListener('click',startGuest);document.querySelector('[data-action=\"equipment\"]')?.addEventListener('click',()=>{screen='equipment';render()});document.querySelector('[data-action=\"pet-tree\"]')?.addEventListener('click',()=>{screen='pet-tree';render()});document.querySelector('[data-action=\"collection\"]')?.addEventListener('click',()=>{screen='collection';render()});document.querySelector('[data-action=\"tower\"]')?.addEventListener('click',startTower);document.querySelector('[data-action=\"setup-back\"]')?.addEventListener('click',()=>{screen='setup';render()});document.querySelector('[data-action=\"reset-pet-tree\"]')?.addEventListener('click',()=>{meta.rpg=resetPetSkills(meta.rpg);saveMeta();render()});document.querySelectorAll('[data-equip]').forEach(b=>b.addEventListener('click',()=>{meta.rpg=equipItem(meta.rpg,b.dataset.equip);saveMeta();render()}));document.querySelectorAll('[data-unequip]').forEach(b=>b.addEventListener('click',()=>{meta.rpg=unequipItem(meta.rpg,b.dataset.unequip);saveMeta();render()}));document.querySelectorAll('[data-synthesize]').forEach(b=>b.addEventListener('click',()=>{meta.rpg=synthesizeItem(meta.rpg,b.dataset.synthesize);saveMeta();render()}));document.querySelectorAll('[data-crystallize]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.crystallize,item=meta.rpg.inventory.find(x=>x.id===id);if(!item)return;const gain=crystalValue(item);if(!confirm(`將「${item.name}」轉換為 ${gain} 個結晶？`))return;meta.rpg=crystallizeItem(meta.rpg,id);saveMeta();render()}));document.querySelectorAll('[data-pet-enhance]').forEach(b=>b.addEventListener('click',()=>{const pet=b.dataset.petEnhance,cost=petEnhanceCost(pet,meta.rpg);if(!cost)return;meta.rpg=enhancePet(pet,meta.rpg);saveMeta();render()}));document.querySelectorAll('[data-pet-skill]').forEach(b=>b.addEventListener('click',()=>{const [pet,node]=b.dataset.petSkill.split('|');meta.rpg=unlockPetSkill(pet,node,meta.level,meta.rpg);saveMeta();render()}));document.querySelector('[data-action=\"line-login\"]')?.addEventListener('click',startLineLogin);document.querySelector('[data-action=\"start\"]')?.addEventListener('click',startRun);document.querySelector('[data-action=\"pk\"]')?.addEventListener('click',startPk);document.querySelector('[data-action=\"quit\"]')?.addEventListener('click',()=>{clearTimers();screen='setup';render()});document.querySelector('[data-action=\"confirm-cards\"]')?.addEventListener('click',()=>confirmCards(false));document.querySelector('[data-action=\"next-stage\"]')?.addEventListener('click',nextStage);document.querySelector('[data-action=\"home\"]')?.addEventListener('click',()=>{clearTimers();screen='home';render()});document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{meta.role=b.dataset.role;saveMeta();render()}));document.querySelectorAll('[data-pet]').forEach(b=>b.addEventListener('click',()=>{meta.pet=b.dataset.pet;saveMeta();render()}));document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.card);if(run.used.includes(i))return;const at=run.selected.indexOf(i);if(at>=0)run.selected.splice(at,1);else if(run.selected.length<3)run.selected.push(i);render()}));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer,false)))}\nrender();""", 'render bind')
