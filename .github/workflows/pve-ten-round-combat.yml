name: Update PvE and tower to ten-round combat
on:
  push:
    paths:
      - '.github/workflows/pve-ten-round-combat.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game.js')
          s=p.read_text()
          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          old_auto="""function startAutoDuel(){clearTimers();const P=run.player,E=run.enemy,steps=[];run.actionStartPlayer=cloneFighter(P);run.actionStartEnemy=cloneFighter(E);let who=run.lastOrder||'player',cycle=1;while(P.hp>0&&E.hp>0){if(who==='player'){const before=E.hp+E.shield;resolveAutoBasic(P,E);run.stats.damage+=Math.max(0,before-(E.hp+E.shield))}else resolveAutoBasic(E,P);steps.push({who,slot:0,cycle,autoDuel:true,finalRound:true,card:null,logs:[],player:cloneFighter(P),enemy:cloneFighter(E)});who=who==='player'?'enemy':'player';if(who===(run.lastOrder||'player'))cycle++}run.steps=steps;run.stepIndex=0;run.log=[];screen='action';render();scheduleActionStep()}"""
          new_auto="""function startAutoDuel(){clearTimers();const P=run.player,E=run.enemy,steps=[],first=run.lastOrder||'player';run.actionStartPlayer=cloneFighter(P);run.actionStartEnemy=cloneFighter(E);for(let autoRound=3;autoRound<=10&&P.hp>0&&E.hp>0;autoRound++){const starter=(autoRound-3)%2===0?first:(first==='player'?'enemy':'player'),order=[starter,starter==='player'?'enemy':'player'];for(const who of order){if(P.hp<=0||E.hp<=0)break;let logs=[];if(who==='player'){const beforePool=E.hp+E.shield,beforeHp=P.hp;logs=resolveAutoBasic(P,E);afterAction(P,E,logs);run.stats.damage+=Math.max(0,beforePool-(E.hp+E.shield));run.stats.heal+=Math.max(0,P.hp-beforeHp)}else{logs=resolveAutoBasic(E,P);afterAction(E,P,logs)}steps.push({who,slot:0,cycle:autoRound,autoDuel:true,finalRound:autoRound===10,card:null,logs:[...logs],player:cloneFighter(P),enemy:cloneFighter(E)})}}run.steps=steps;run.stepIndex=0;run.log=[];screen='action';render();scheduleActionStep()}"""
          rep(old_auto,new_auto,'startAutoDuel')

          old_sched="""function scheduleActionStep(){clearTimeout(actionTimer);actionTimer=setTimeout(()=>{if(screen!=='action')return;if(run.stepIndex<run.steps.length-1){run.stepIndex++;render();scheduleActionStep()}else actionTimer=setTimeout(()=>{if(run.player.hp<=0||run.enemy.hp<=0)finishBattle();else if(run.round>=3)startAutoDuel();else nextRound()},run.steps[run.stepIndex]?.autoDuel?650:1100)},stepDelay())}"""
          new_sched="""function scheduleActionStep(){clearTimeout(actionTimer);actionTimer=setTimeout(()=>{if(screen!=='action')return;if(run.stepIndex<run.steps.length-1){run.stepIndex++;render();scheduleActionStep()}else actionTimer=setTimeout(()=>{if(run.steps[run.stepIndex]?.autoDuel)return finishBattle();if(run.player.hp<=0||run.enemy.hp<=0)return finishBattle();if(run.round>=2)return startAutoDuel();nextRound()},run.steps[run.stepIndex]?.autoDuel?650:1100)},stepDelay())}"""
          rep(old_sched,new_sched,'scheduleActionStep')

          old_next="""function nextRound(){if(run.player.hp<=0||run.enemy.hp<=0||run.round>=3)return finishBattle();run.round++;run.selected=[];run.enemySelected=[];run.selectDeadline=0;screen='cards';render()}"""
          new_next="""function nextRound(){if(run.player.hp<=0||run.enemy.hp<=0)return finishBattle();if(run.round>=2)return startAutoDuel();run.round++;run.selected=[];run.enemySelected=[];run.selectDeadline=0;screen='cards';render()}"""
          rep(old_next,new_next,'nextRound')

          # Card/selected-card UI exists only for rounds 1-2.
          count=s.count('run.round<=3')
          if count!=4: raise SystemExit(f'round<=3 expected 4 matches, got {count}')
          s=s.replace('run.round<=3','run.round<=2')

          old_visual="""function actionVisual(step,prevP,prevE,p,e){if(!step)return null;const mine=step.who==='player',card=step.card,actorPrev=mine?prevP:prevE,actorNow=mine?p:e,targetPrev=mine?prevE:prevP,targetNow=mine?e:p,logs=step.logs||[];const damage=Math.max(0,Math.round((targetPrev?.hp||0)-(targetNow?.hp||0))),heal=Math.max(0,Math.round((actorNow?.hp||0)-(actorPrev?.hp||0))),shield=Math.max(0,Math.round((actorNow?.shield||0)-(actorPrev?.shield||0))),crit=logs.some(x=>String(x).includes('爆擊'));let kind='slash',self=false;if(heal>0||card?.id==='restore'||card?.id==='regen'||card?.stat==='hp'){kind='heal';self=true}else if(shield>0||card?.id==='diamond'||card?.id==='aegis'||card?.stat==='def'){kind='guard';self=true}else if(crit||card?.id==='sacrifice')kind='crit';else if(card&&!isOffensive(card)){kind='guard';self=true}const amount=heal>0?`+${heal}`:shield>0?`+${shield}`:damage>0?`-${damage}`:'';return {kind,self,amount,crit,mine}}"""
          new_visual=old_visual+"\nfunction autoActionVisual(step,prevP,prevE,p,e){if(!step)return null;const mine=step.who==='player',targetPrev=mine?prevE:prevP,targetNow=mine?e:p,damage=Math.max(0,Math.round((targetPrev?.hp||0)-(targetNow?.hp||0)));return {kind:'slash',self:false,amount:damage>0?`-${damage}`:'',crit:false,mine}}"
          rep(old_visual,new_visual,'autoActionVisual')

          old_render="""function renderAction(){const step=run.steps[run.stepIndex],prev=run.stepIndex>0?run.steps[run.stepIndex-1]:null,prevP=prev?.player||run.actionStartPlayer,prevE=prev?.enemy||run.actionStartEnemy,p=step?.player||run.player,e=step?.enemy||run.enemy,metaFx=actionVisual(step,prevP,prevE,p,e);if(step?.autoDuel)return `<main class=\"battle-screen combat-focus action-screen auto-duel-screen\">${combatHeader({playerState:p,enemyState:e,activeStep:step,showChosen:false,visualMeta:metaFx})}</main>`;const title=step?.card?cardSummary(step.card):'',actorColor=step?.who==='player'?'#447257':'#49739b';return `<main class=\"battle-screen combat-focus action-screen\">${combatHeader({playerState:p,enemyState:e,activeStep:step,showChosen:run.round<=2,visualMeta:metaFx})}<section class=\"action-status\"><h1>${esc(title)}</h1><div class=\"battle-log current-log\">${(step?.logs||[]).slice(-3).map(x=>`<p style=\"color:${actorColor}\">${esc(x)}</p>`).join('')}${lifeDelta(prevP,prevE,p,e)}</div></section></main>`}"""
          new_render="""function renderAction(){const step=run.steps[run.stepIndex],prev=run.stepIndex>0?run.steps[run.stepIndex-1]:null,prevP=prev?.player||run.actionStartPlayer,prevE=prev?.enemy||run.actionStartEnemy,p=step?.player||run.player,e=step?.enemy||run.enemy,metaFx=step?.autoDuel?autoActionVisual(step,prevP,prevE,p,e):actionVisual(step,prevP,prevE,p,e);if(step?.autoDuel)return `<main class=\"battle-screen combat-focus action-screen auto-duel-screen\">${combatHeader({playerState:p,enemyState:e,activeStep:step,showChosen:false,visualMeta:metaFx})}</main>`;const title=step?.card?cardSummary(step.card):'',actorColor=step?.who==='player'?'#447257':'#49739b';return `<main class=\"battle-screen combat-focus action-screen\">${combatHeader({playerState:p,enemyState:e,activeStep:step,showChosen:run.round<=2,visualMeta:metaFx})}<section class=\"action-status\"><h1>${esc(title)}</h1><div class=\"battle-log current-log\">${(step?.logs||[]).slice(-3).map(x=>`<p style=\"color:${actorColor}\">${esc(x)}</p>`).join('')}${lifeDelta(prevP,prevE,p,e)}</div></section></main>`}"""
          rep(old_render,new_render,'renderAction')

          old_finish="""function finishBattle(){const p=run.player.hp/run.player.maxHp,e=run.enemy.hp/run.enemy.maxHp,win=run.enemy.hp<=0||(run.player.hp>0&&p>=e);if(!win){screen='lose';render();return}rewardStage();if(run.mode==='tower'){if((run.towerFloor||1)>=TOWER_MAX){screen='win';render();return}screen='stage-clear';render();return}if(run.stageIndex>=STAGES.length-1){screen='win';render();return}screen='stage-clear';render()}"""
          new_finish="""function finishBattle(){const p=Math.max(0,Math.round(run.player.hp)),e=Math.max(0,Math.round(run.enemy.hp));if(p===e){screen='draw';render();return}const win=e<=0||(p>0&&p>e);if(!win){screen='lose';render();return}rewardStage();if(run.mode==='tower'){if((run.towerFloor||1)>=TOWER_MAX){screen='win';render();return}screen='stage-clear';render();return}if(run.stageIndex>=STAGES.length-1){screen='win';render();return}screen='stage-clear';render()}"""
          rep(old_finish,new_finish,'finishBattle actual hp')

          old_next_stage="""function nextStage(){run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.critLock=0;run.player.regen=0;run.player.regenFresh=false;if(run.mode==='tower')run.towerFloor=Math.min(TOWER_MAX,(run.towerFloor||1)+1);else run.stageIndex++;beginStage()}"""
          new_next_stage="""function nextStage(){run.player.hp=Math.min(run.player.maxHp,run.player.hp+Math.round(run.player.maxHp*.2));run.player.poison=[];run.player.armorBreak=[];run.player.atkDown=[];run.player.defBoost=[];run.player.healBlock=[];run.player.stun=0;run.player.critLock=0;run.player.regen=0;run.player.regenFresh=false;if(run.mode==='tower')run.towerFloor=Math.min(TOWER_MAX,(run.towerFloor||1)+1);else run.stageIndex++;beginStage()}"""
          rep(old_next_stage,new_next_stage,'clear direct-combat states')

          old_result="""function renderResult(win){return `<main class=\"result-screen\"><section class=\"result-card final-result-card\">${win?victoryImg():failImg()}${summaryHtml()}${win?rewardHtml()+lootHtml():''}${wrongAnalysisHtml()}<div style=\"width:min(112px,28vw);margin:18px auto 0\">${imageButton(ASSETS.ui.back,'回首頁','data-action=\"home\"')}</div></section></main>`}"""
          new_result="""function renderResult(win){const draw=win==='draw',won=win===true;return `<main class=\"result-screen\"><section class=\"result-card final-result-card\">${draw?'<h1>平手</h1>':won?victoryImg():failImg()}${summaryHtml()}${won?rewardHtml()+lootHtml():''}${wrongAnalysisHtml()}<div style=\"width:min(112px,28vw);margin:18px auto 0\">${imageButton(ASSETS.ui.back,'回首頁','data-action=\"home\"')}</div></section></main>`}"""
          rep(old_result,new_result,'draw result')

          old_switch="""screen==='win'?renderResult(true):screen==='lose'?renderResult(false):renderHome()"""
          new_switch="""screen==='win'?renderResult(true):screen==='lose'?renderResult(false):screen==='draw'?renderResult('draw'):renderHome()"""
          rep(old_switch,new_switch,'render draw branch')

          p.write_text(s)
          PY
      - name: Verify
        shell: bash
        run: |
          set -e
          node --check src/game.js
          for f in src/*.js worker/index.js; do node --check "$f"; done
          npm test
          grep -Fq "for(let autoRound=3;autoRound<=10" src/game.js
          grep -Fq "if(run.round>=2)return startAutoDuel()" src/game.js
          grep -Fq "function autoActionVisual" src/game.js
          grep -Fq "screen==='draw'?renderResult('draw')" src/game.js
          grep -Fq "run.player.healBlock=[];run.player.stun=0" src/game.js
          ! grep -Fq "run.round<=3" src/game.js
          ! grep -Fq "run.round>=3" src/game.js
      - name: Commit source
        shell: bash
        run: |
          git config user.name "openai-workflow"
          git config user.email "actions@users.noreply.github.com"
          git add src/game.js
          git diff --cached --quiet && exit 1
          git commit -m "feat: align PvE and tower with ten-round combat"
          git push origin HEAD:main
